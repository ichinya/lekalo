[package]
name = "lekalo-target-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Observed Python symbol scanner for the lekalo.target/v1 process protocol (issue #146). Read-only static analysis: no Python execution, no imports, no network."
repository = "https://github.com/ichinya/lekalo"
publish = false

[dependencies]
lekalo-adapter-sdk-rust = { path = "../../sdk/rust" }
ruff_python_ast = "=0.0.18"
ruff_python_parser = "=0.0.18"
ruff_source_file = "=0.0.18"
ruff_text_size = "=0.0.18"
sha2 = "0.11"

[[bin]]
name = "lekalo-target-python"
path = "src/main.rs"

[workspace]
