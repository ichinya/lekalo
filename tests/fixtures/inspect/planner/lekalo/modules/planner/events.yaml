schema_version: "1.0.0"
definitions:
  - id: planner.task_focused
    kind: event
    version: 1
    description: "A task became focused"
    payload:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: focused_at
        type: "planner.due_date"
  - id: planner.task_archived
    kind: event
    version: 1
    description: "A task was archived"
    payload:
      - name: task_id
        type: "planner.task_id"
        required: true
