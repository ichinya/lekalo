{"schema_version":"0.2.16","definitions":[{"id":"changelog.author_creates_draft","kind":"policy","version":1,"description":"Explicit opt-in drafts inside the tenant and workspace","applies_to":["changelog.create_draft","changelog.edit_draft"],"decision":"allow"},{"id":"changelog.reviewer_previews","kind":"policy","version":1,"description":"A reviewer produces the canonical public preview","applies_to":["changelog.preview_entry"],"decision":"allow"},{"id":"changelog.authority_approves","kind":"policy","version":1,"description":"Only the publishing authority records an approval binding","applies_to":["changelog.approve_entry"],"decision":"allow"},{"id":"changelog.authority_publishes","kind":"policy","version":1,"description":"Only the publishing authority publishes with a fresh bound approval","applies_to":["changelog.publish_entry"],"decision":"allow"},{"id":"changelog.authority_withdraws","kind":"policy","version":1,"description":"Authorized withdrawal hides the public projection","applies_to":["changelog.withdraw_entry"],"decision":"allow"}]}