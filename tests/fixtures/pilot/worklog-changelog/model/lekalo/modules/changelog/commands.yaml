,"portability":"portable","input":[{"name":"entry_id","type":{"ref":"changelog.entry_id"},"required":true},{"name":"tenant_id","type":{"ref":"worklog.tenant_id"},"required":true}],"effects":["changelog.effect_withdraw_write","changelog.effect_audit_append"]}]}