{"schema_version":"0.2.16","definitions":[{"id":"changelog.effect_draft_write","kind":"effect","version":1,"description":"Create one draft entry row","visibility":"project","portability":"portable","operation":"create","entity":"changelog.entry"},{"id":"changelog.effect_draft_edit","kind":"effect","version":1,"description":"Update one draft entry row","visibility":"project","portability":"portable","operation":"update","entity":"changelog.entry"},{"id":"changelog.effect_preview_write","kind":"effect","version":1,"description":"Record the canonical sanitized preview bytes","visibility":"project","portability":"portable","operation":"update","entity":"changelog.entry"},{"id":"changelog.effect_approval_write","kind":"effect","version":1,"description":"Record one approval binding","visibility":"project","portability":"portable","operation":"create","entity":"changelog.approval"},{"id":"changelog.effect_snapshot_append","kind":"effect","version":1,"description":"Append one immutable snapshot row","visibility":"project","portability":"portable","operation":"create","entity":"changelog.snapshot"},{"id":"changelog.effect_visibility_write","kind":"effect","version":1,"description":"Update the entry visibility and lifecycle inside the publication transaction","visibility":"project","portability":"portable","operation":"update","entity":"changelog.entry"},{"id":"changelog.effect_publication_emit","kind":"effect","version":1,"description":"Declare the separate publish-output of the public payload","visibility":"project","portability":"portable","operation":"update","entity":"changelog.snapshot"},{"id":"changelog.effect_withdraw_write","kind":"effect","version":1,"description":"Hide the public projection on authorized withdrawal","visibility":"project","portability":"portable","operation":"update","entity":"changelog.entry"},{"id":"changelog.effect_audit_append","kind":"effect","version":1,"description":"Append one lifecycle audit record","visibility":"project","portability":"portable","operation":"create","entity":"changelog.audit"},{"id":"changelog.create_draft","kind":"command","version":1,"description":"Explicit opt-in creates one independent draft; copying source content is a reviewed projection and private fields are never inherited wholesale","derived_from":["TASKHUB-REQ-004"],"visibility":"project","portability":"portable","input":[{"name":"entry_id","type":{"ref":"changelog.entry_id"},"required":true},{"name":"tenant_id","type":{"ref":"worklog.tenant_id"},"required":true},{"name":"workspace_id","type":{"ref":"worklog.workspace_id"},"required":true},{"name":"source_worklog_id","type":{"optional":{"ref":"worklog.task_id"}}},{"name":"draft_body","type":{"ref":"changelog.public_field_text"},"required":true}],"effects":["changelog.effect_draft_write"]},{"id":"changelog.edit_draft","kind":"command","version":1,"description":"Explicit opt-in edits the independent draft; any draft change invalidates approval","derived_from":["TASKHUB-REQ-004"],"visibility":"project","portability":"portable","input":[{"name":"entry_id","type":{"ref":"changelog.entry_id"},"required":true},{"name":"tenant_id","type":{"ref":"worklog.tenant_id"},"required":true},{"name":"draft_body","type":{"ref":"changelog.public_field_text"},"required":true},{"name":"expected_revision","type":{"ref":"worklog.record_revision"},"required":true}],"effects":["changelog.effect_draft_edit"]},{"id":"changelog.preview_entry","kind":"command","version":1,"description":"Produce the canonical sanitized public preview bytes under the shared preview and final rendering policy","derived_from":["TASKHUB-REQ-005"],"visibility":"project","portability":"portable","input":[{"name":"entry_id","type":{"ref":"changelog.entry_id"},"required":true},{"name":"tenant_id","type":{"ref":"worklog.tenant_id"},"required":true},{"name":"expected_revision","type":{"ref":"worklog.record_revision"},"required":true}],"effects":["changelog.effect_preview_write"]},{"id":"changelog.approve_entry","kind":"command",