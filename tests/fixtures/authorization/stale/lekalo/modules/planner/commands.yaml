schema_version: "1.0.0"
definitions:
  - id: planner.effect.create_task
    kind: effect
    version: 1
    operation: create
    entity: "planner.task"
  - id: planner.effect.update_task
    kind: effect
    version: 1
    operation: update
    entity: "planner.task"
  - id: planner.create_task
    kind: command
    version: 1
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: tenant_id
        type: "planner.tenant_id"
        required: true
      - name: workspace_id
        type: "planner.workspace_id"
        required: true
      - name: owner_id
        type: "planner.owner_id"
        required: true
      - name: title
        type: "planner.title"
        required: true
    effects:
      - "planner.effect.create_task"
  - id: planner.update_task
    kind: command
    version: 1
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: tenant_id
        type: "planner.tenant_id"
      - name: state
        type: "planner.task_state"
    effects:
      - "planner.effect.update_task"
