schema_version: "0.2.16"
definitions:
  - id: tasklinks.effect.attach_link
    kind: effect
    version: 1
    description: "Local link reservation"
    operation: create
    entity: "tasklinks.task_external_link"
  - id: tasklinks.effect.update_task_from_provider
    kind: effect
    version: 1
    description: "Canonical task update from an attributed inbound event"
    operation: update
    entity: "planner.task"
  - id: tasklinks.effect.detach_link
    kind: effect
    version: 1
    description: "History-preserving detach; never an external delete"
    operation: update
    entity: "tasklinks.task_external_link"
  - id: tasklinks.effect.write_outbox
    kind: effect
    version: 1
    description: "Durable outbox intent commit"
    operation: create
    entity: "tasklinks.outbox_item"
  - id: tasklinks.effect.record_receipt
    kind: effect
    version: 1
    description: "Inbox receipt write"
    operation: create
    entity: "tasklinks.inbox_receipt"
  - id: tasklinks.effect.record_resolution_audit
    kind: effect
    version: 1
    description: "Immutable conflict-resolution audit append"
    operation: create
    entity: "tasklinks.resolution_audit"
  - id: tasklinks.effect.resolve_conflict
    kind: effect
    version: 1
    description: "Audited conflict resolution"
    operation: update
    entity: "tasklinks.conflict"
  - id: tasklinks.attach_link
    kind: command
    version: 1
    description: "Reserve one external identity for one task"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: workspace_id
        type: "planner.workspace_id"
        required: true
      - name: link_id
        type: "tasklinks.link_id"
        required: true
      - name: external_id
        type: "tasklinks.external_id"
        required: true
    effects:
      - "tasklinks.effect.attach_link"
  - id: tasklinks.import_link
    kind: command
    version: 1
    description: "Import one external object idempotently"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: workspace_id
        type: "planner.workspace_id"
        required: true
      - name: link_id
        type: "tasklinks.link_id"
        required: true
      - name: external_id
        type: "tasklinks.external_id"
        required: true
    effects:
      - "tasklinks.effect.attach_link"
  - id: tasklinks.ingest_event
    kind: command
    version: 1
    description: "Deduplicate, attribute, and apply one inbound event"
    input:
      - name: link_id
        type: "tasklinks.link_id"
        required: true
      - name: event_identity
        type: "tasklinks.external_id"
        required: true
      - name: revision
        type: "tasklinks.revision"
        required: true
    effects:
      - "tasklinks.effect.update_task_from_provider"
      - "tasklinks.effect.record_receipt"
  - id: tasklinks.request_action
    kind: command
    version: 1
    description: "Commit the canonical update, decisions, outbox intents, and audit together"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: workspace_id
        type: "planner.workspace_id"
        required: true
      - name: action
        type: "tasklinks.external_id"
        required: true
    effects:
      - "tasklinks.effect.write_outbox"
      - "tasklinks.effect.update_task_from_provider"
  - id: tasklinks.detach_link
    kind: command
    version: 1
    description: "Detach preserving history and the external object"
    input:
      - name: link_id
        type: "tasklinks.link_id"
        required: true
    effects:
      - "tasklinks.effect.detach_link"
  - id: tasklinks.resolve_conflict
    kind: command
    version: 1
    description: "Resolve one conflict under explicit preconditions with an immutable audit"
    input:
      - name: conflict_id
        type: "tasklinks.link_id"
        required: true
      - name: expected_link_version
        type: "tasklinks.revision"
        required: true
    effects:
      - "tasklinks.effect.resolve_conflict"
      - "tasklinks.effect.record_resolution_audit"
  - id: tasklinks.dispatch_outbox
    kind: command
    version: 1
    description: "Claim, dispatch, and record one eligible intent"
    input:
      - name: intent_id
        type: "tasklinks.link_id"
        required: true
    effects:
      - "tasklinks.effect.write_outbox"
  - id: tasklinks.ack_delivery
    kind: command
    version: 1
    description: "Acknowledge one provider delivery"
    input:
      - name: intent_id
        type: "tasklinks.link_id"
        required: true
    effects:
      - "tasklinks.effect.write_outbox"
