schema_version: "1.0.0"
definitions:
  - id: planner.focus_task
    kind: command
    version: 1
    description: "Focus one task"
    derived_from:
      - "PLANNER-REQ-001"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: source_task_id
        type: "planner.task_id"
    effects:
      - "planner.create_task"
      - "planner.task_focused"
  - id: planner.create_task
    kind: effect
    version: 1
    description: "Creates the focused task"
    operation: create
    entity: "planner.task"
    emits:
      - "planner.task_focused"
