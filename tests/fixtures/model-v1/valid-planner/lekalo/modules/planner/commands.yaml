{"schema_version":"0.2.16","definitions":[
{"id":"planner.effect_task_created","kind":"effect","version":1,"description":"Create a task record","operation":"create","entity":"planner.task","emits":["planner.task_created"]},
{"id":"planner.focus_task","kind":"command","version":1,"description":"Focus one task for a user","derived_from":["PLANNER-REQ-001"],"visibility":"module","portability":"portable","input":[{"name":"task_id","type":{"ref":"planner.task_id"},"required":true}],"effects":["planner.effect_task_created"]},
{"id":"planner.plan_task","kind":"command","version":1,"description":"Plan one task into the actor's day","derived_from":["PLANNER-REQ-002"],"input":[{"name":"task_id","type":{"ref":"planner.task_id"},"required":true},{"name":"planned_for","type":{"ref":"planner.planning_date"},"required":true}]},
{"id":"planner.move_task","kind":"command","version":1,"description":"Move one planned task to another position or day","derived_from":["PLANNER-REQ-002"],"input":[{"name":"planning_id","type":{"ref":"planner.planning_id"},"required":true},{"name":"position","type":{"ref":"planner.position"},"required":true}]},
{"id":"planner.unplan_task","kind":"command","version":1,"description":"Remove one task from the plan","derived_from":["PLANNER-REQ-002"],"input":[{"name":"planning_id","type":{"ref":"planner.planning_id"},"required":true}]},
{"id":"planner.reorder_planned","kind":"command","version":1,"description":"Reorder one planned day under the optimistic version","derived_from":["PLANNER-REQ-002"],"input":[{"name":"planned_for","type":{"ref":"planner.planning_date"},"required":true},{"name":"expected_version","type":{"ref":"planner.reorder_version"},"required":true},{"name":"order","type":{"ref":"planner.planning_order"},"required":true}]},
{"id":"planner.pause_planning","kind":"command","version":1,"description":"Pause the focus timer of one planned task","derived_from":["PLANNER-REQ-003"],"input":[{"name":"planning_id","type":{"ref":"planner.planning_id"},"required":true}]},
{"id":"planner.complete_planning","kind":"command","version":1,"description":"Complete one planned task; stamps completed_at from the declared clock","derived_from":["PLANNER-REQ-002"],"input":[{"name":"planning_id","type":{"ref":"planner.planning_id"},"required":true}]}
]}
