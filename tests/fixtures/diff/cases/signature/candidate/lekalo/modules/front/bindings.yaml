schema_version: "1.0.0"
definitions:
  - id: shop.binding_node
    kind: target-binding
    version: 1
    description: "Node binding"
    target: node-typescript
  - id: shop.api_create
    kind: endpoint
    version: 1
    description: "HTTP create entry"
    invokes: "shop.create_item"
    method: POST
    path: "/items"
