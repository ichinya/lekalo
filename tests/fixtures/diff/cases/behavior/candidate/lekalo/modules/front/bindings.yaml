    kind: target-binding
    version: 1
    portability: target-specific
    description: "Node binding"
    target: deno-typescript
  - id: shop.api_create
    kind: endpoint
    version: 1
    description: "HTTP create entry"
    invokes: "shop.create_item"
    method: PUT
    path: "/v2/items"
