schema_version: "0.2.16"
definitions:
  - id: planner.binding_node
    kind: target-binding
    version: 1
    description: "Bind the planner module to the TypeScript target"
    portability: target-specific
    target: node-typescript
  - id: planner.binding_php
    kind: target-binding
    version: 1
    description: "Bind the planner module to the Laravel target"
    portability: target-specific
    target: php-laravel
  - id: planner.binding_go
    kind: target-binding
    version: 1
    description: "Bind the planner module to the Go service target"
    portability: target-specific
    target: go-service
  - id: planner.api_focus
    kind: endpoint
    version: 1
    description: "HTTP focus entry point"
    invokes: "planner.focus_task"
    method: POST
    path: "/tasks/{task_id}/focus"
