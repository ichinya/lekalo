schema_version: "0.2.16"
definitions:
  - id: planner.create_task
    kind: effect
    version: 1
    description: "Creates the focused task"
    operation: create
    entity: "planner.task"
    emits:
      - "planner.task_focused"
  - id: planner.edit_task
    kind: effect
    version: 1
    description: "Edits task fields"
    operation: update
    entity: "planner.task"
  - id: planner.archive_task
    kind: effect
    version: 1
    description: "Archives a task"
    operation: delete
    entity: "planner.task"
    emits:
      - "planner.task_archived"
  - id: planner.focus_task
    kind: command
    version: 1
    description: "Focus one task"
    derived_from:
      - "PLANNER-REQ-001"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
    effects:
      - "planner.create_task"
  - id: planner.edit_task_cmd
    kind: command
    version: 1
    description: "Edit task fields"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: title
        type: "planner.text"
    effects:
      - "planner.edit_task"
  - id: planner.archive_task_cmd
    kind: command
    version: 1
    description: "Archive one task"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
    effects:
      - "planner.archive_task"
  - id: planner.schedule_calculate
    kind: command
    version: 1
    description: "Calculate the focused schedule for one task window"
    derived_from:
      - "PLANNER-REQ-002"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: window
        type: "planner.due_window"
        required: true
      - name: weight
        type: "planner.weight"
        required: true
    effects:
      - "planner.schedule_write"
  - id: planner.schedule_write
    kind: effect
    version: 1
    description: "Persists the calculated schedule"
    operation: update
    entity: "planner.task"
    emits:
      - "planner.task_scheduled"
