schema_version: "0.2.16"
definitions:
  - id: planner.update_task
    kind: effect
    version: 1
    description: "Focuses an existing task row"
    operation: update
    entity: "planner.task"
    emits:
      - "planner.task_focused"
  - id: planner.focus_task
    kind: command
    version: 1
    description: "Focus one task"
    derived_from:
      - "PLANNER-REQ-001"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
    effects:
      - "planner.update_task"
