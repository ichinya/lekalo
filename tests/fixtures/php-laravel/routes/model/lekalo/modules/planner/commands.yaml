schema_version: "0.2.16"
definitions:
  - id: planner.update_task
    kind: effect
    version: 1
    description: "Focuses an existing task row"
    operation: update
    entity: "planner.task"
    emits:
      - "planner.task_focused"
  - id: planner.focus_task
    kind: command
    version: 1
    description: "Focus one task"
    derived_from:
      - "PLANNER-REQ-001"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
    effects:
      - "planner.update_task"
  - id: planner.effect_planning_created
    kind: effect
    version: 1
    description: "Creates one planning row for the actor"
    operation: create
    entity: "planner.user_task_planning"
    emits:
      - "planner.task_planned"
  - id: planner.effect_planning_moved
    kind: effect
    version: 1
    description: "Moves one planning row to its new day and position"
    operation: update
    entity: "planner.user_task_planning"
  - id: planner.effect_planning_deleted
    kind: effect
    version: 1
    description: "Removes one planning row"
    operation: delete
    entity: "planner.user_task_planning"
    emits:
      - "planner.task_unplanned"
  - id: planner.effect_planning_reordered
    kind: effect
    version: 1
    description: "Rewrites the order of one planned day under the optimistic version"
    operation: update
    entity: "planner.user_task_planning"
    emits:
      - "planner.planning_reordered"
  - id: planner.effect_planning_paused
    kind: effect
    version: 1
    description: "Stamps the pause time of one planning row"
    operation: update
    entity: "planner.user_task_planning"
    emits:
      - "planner.planning_paused"
  - id: planner.effect_planning_completed
    kind: effect
    version: 1
    description: "Stamps the completion time of one planning row"
    operation: update
    entity: "planner.user_task_planning"
    emits:
      - "planner.task_completed"
  - id: planner.plan_task
    kind: command
    version: 1
    description: "Plan one task into the actor's day; idempotent per workspace, user, task and day"
    derived_from:
      - "PLANNER-REQ-002"
    input:
      - name: task_id
        type: "planner.task_id"
        required: true
      - name: planned_for
        type: "planner.planning_date"
        required: true
    effects:
      - "planner.effect_planning_created"
  - id: planner.move_task
    kind: command
    version: 1
    description: "Move one planned task to an explicit day and position"
    derived_from:
      - "PLANNER-REQ-002"
    input:
      - name: planning_id
        type: "planner.planning_id"
        required: true
      - name: planned_for
        type: "planner.planning_date"
        required: true
      - name: position
        type: "planner.position"
        required: true
    effects:
      - "planner.effect_planning_moved"
  - id: planner.unplan_task
    kind: command
    version: 1
    description: "Remove one planned task from the plan"
    derived_from:
      - "PLANNER-REQ-002"
    input:
      - name: planning_id
        type: "planner.planning_id"
        required: true
    effects:
      - "planner.effect_planning_deleted"
  - id: planner.reorder_planned
    kind: command
    version: 1
    description: "Reorder one planned day; refused with reorder_stale unless the expected reorder version still matches"
    derived_from:
      - "PLANNER-REQ-005"
    input:
      - name: planned_for
        type: "planner.planning_date"
        required: true
      - name: expected_version
        type: "planner.reorder_version"
        required: true
      - name: order
        type: "planner.planning_order"
        required: true
    effects:
      - "planner.effect_planning_reordered"
  - id: planner.pause_planning
    kind: command
    version: 1
    description: "Pause one planned task; stamps paused_at from the declared clock"
    derived_from:
      - "PLANNER-REQ-003"
    input:
      - name: planning_id
        type: "planner.planning_id"
        required: true
    effects:
      - "planner.effect_planning_paused"
  - id: planner.complete_planning
    kind: command
    version: 1
    description: "Complete one planned task; stamps completed_at from the declared clock and refuses an already completed row"
    derived_from:
      - "PLANNER-REQ-007"
    input:
      - name: planning_id
        type: "planner.planning_id"
        required: true
    effects:
      - "planner.effect_planning_completed"
