schema_version: "0.2.16"
definitions:
  - id: planner.count_focused
    kind: query
    version: 1
    description: "Count focused tasks"
    derived_from:
      - "PLANNER-REQ-001"
    reads:
      - "planner.task"
    returns:
      ref: "planner.task_state"
  - id: planner.list_tasks
    kind: query
    version: 1
    description: "The today board: list the planner tasks"
    derived_from:
      - "PLANNER-REQ-001"
    reads:
      - "planner.task"
    returns:
      list:
        ref: "planner.task"
  - id: planner.today_planning
    kind: query
    version: 1
    description: "The planning rows of the actor-local today; the date never shifts silently"
    derived_from:
      - "PLANNER-REQ-002"
    reads:
      - "planner.user_task_planning"
    returns:
      list:
        ref: "planner.user_task_planning"
  - id: planner.backlog_tasks
    kind: query
    version: 1
    description: "The workspace tasks with no planning row yet, in stable title order"
    derived_from:
      - "PLANNER-REQ-002"
    reads:
      - "planner.user_task_planning"
    returns:
      list:
        ref: "planner.user_task_planning"
  - id: planner.carry_over
    kind: query
    version: 1
    description: "The planning rows of earlier days, served at their original planned_for; a read never rewrites the stored date"
    derived_from:
      - "PLANNER-REQ-004"
    reads:
      - "planner.user_task_planning"
    returns:
      list:
        ref: "planner.user_task_planning"
