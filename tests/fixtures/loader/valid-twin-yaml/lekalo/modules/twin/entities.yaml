schema_version: "1.0.0"
definitions:
  - id: twin.label
    kind: scalar
    version: 1
    base: string
  - id: twin.box
    kind: entity
    version: 1
    fields:
      - name: label
        type: label
        required: true
      - name: tags
        type: list<label>
        required: true
      - name: note
        type: label?
        required: true
    identity:
      - label
