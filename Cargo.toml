[workspace]
members = [
    "crates/lekalo-cli",
    "crates/lekalo-core",
]
resolver = "2"

[workspace.package]
version = "1.3.1"
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ichinya/lekalo"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
lekalo-core = { path = "crates/lekalo-core" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
saphyr-parser = "0.4"
sha2 = "0.11"
unicode-normalization = "0.1"
tempfile = "3"
notify = "8"
ignore = "0.4"

[workspace.dependencies.rustix]
version = "1"
features = ["fs"]

[workspace.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Storage_FileSystem"]

# Keep local builds aligned with CI on disk-limited development hosts.
# Debug assertions and overflow checks remain enabled (the dev/test defaults).
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# External process custody hashes executable bytes on each exchange. Keep the
# hash implementation fast in development without disabling any pin checks,
# debug assertions, or overflow checks in the host.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
