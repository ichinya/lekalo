services:
  node:
    environment:
      REFERENCE_QUERY_SERVICE_URL: http://reader:8080
    depends_on:
      reader: { condition: service_started }
  reader:
    image: node:24-bookworm@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40
    working_dir: /workspace/examples/planner-node
    command: ["node", "src/server.mjs"]
    environment:
      DATABASE_URL: postgres://reference_reader@postgres:5432/lekalo_reference
      HOST: 0.0.0.0
      REFERENCE_READ_ONLY: "1"
      REFERENCE_NOW: "2026-01-02T00:30:00Z"
    volumes: ["./planner-node:/workspace/examples/planner-node:ro"]
    ports: ["127.0.0.1:${REFERENCE_READER_PORT:-56333}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
