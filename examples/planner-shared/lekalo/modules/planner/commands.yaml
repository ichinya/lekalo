{
  "schema_version": "0.2.16",
  "definitions": [
    {
      "description": "Creates one planning row for the actor",
      "entity": "planner.user_task_planning",
      "id": "planner.effect_planning_created",
      "kind": "effect",
      "operation": "create",
      "version": 1
    },
    {
      "description": "Removes one planning row",
      "entity": "planner.user_task_planning",
      "id": "planner.effect_planning_deleted",
      "kind": "effect",
      "operation": "delete",
      "version": 1
    },
    {
      "description": "Stamps the pause time of one planning row",
      "entity": "planner.user_task_planning",
      "id": "planner.effect_planning_paused",
      "kind": "effect",
      "operation": "update",
      "version": 1
    },
    {
      "description": "Rewrites the order of one planned day under the optimistic version",
      "entity": "planner.user_task_planning",
      "id": "planner.effect_planning_reordered",
      "kind": "effect",
      "operation": "update",
      "version": 1
    },
    {
      "derived_from": [
        "PLANNER-REQ-001"
      ],
      "description": "Focus one task",
      "effects": [
        "planner.update_task"
      ],
      "id": "planner.focus_task",
      "input": [
        {
          "name": "task_id",
          "required": true,
          "type": {
            "ref": "planner.task_id"
          }
        }
      ],
      "kind": "command",
      "version": 1
    },
    {
      "derived_from": [
        "PLANNER-REQ-002"
      ],
      "description": "Pause one planned task; stamps paused_at from the declared clock",
      "effects": [
        "planner.effect_planning_paused"
      ],
      "id": "planner.pause_planning",
      "input": [
        {
          "name": "planning_id",
          "required": true,
          "type": {
            "ref": "planner.planning_id"
          }
        }
      ],
      "kind": "command",
      "version": 1
    },
    {
      "derived_from": [
        "PLANNER-REQ-002"
      ],
      "description": "Plan one task into the actor's day; idempotent per workspace, user, task and day",
      "effects": [
        "planner.effect_planning_created"
      ],
      "id": "planner.plan_task",
      "input": [
        {
          "name": "task_id",
          "required": true,
          "type": {
            "ref": "planner.task_id"
          }
        },
        {
          "name": "planned_for",
          "required": true,
          "type": {
            "ref": "planner.planning_date"
          }
        }
      ],
      "kind": "command",
      "version": 1
    },
    {
      "derived_from": [
        "PLANNER-REQ-002"
      ],
      "description": "Reorder one planned day; refused with reorder_stale unless the expected reorder version still matches",
      "effects": [
        "planner.effect_planning_reordered"
      ],
      "id": "planner.reorder_planned",
      "input": [
        {
          "name": "planned_for",
          "required": true,
          "type": {
            "ref": "planner.planning_date"
          }
        },
        {
          "name": "expected_version",
          "required": true,
          "type": {
            "ref": "planner.reorder_version"
          }
        },
        {
          "name": "order",
          "required": true,
          "type": {
            "ref": "planner.planning_order"
          }
        }
      ],
      "kind": "command",
      "version": 1
    },
    {
      "derived_from": [
        "PLANNER-REQ-002"
      ],
      "description": "Remove one planned task from the plan",
      "effects": [
        "planner.effect_planning_deleted"
      ],
      "id": "planner.unplan_task",
      "input": [
        {
          "name": "planning_id",
          "required": true,
          "type": {
            "ref": "planner.planning_id"
          }
        }
      ],
      "kind": "command",
      "version": 1
    },
    {
      "description": "Focus the actor-owned planning row for this task on the actor-local today",
      "entity": "planner.user_task_planning",
      "id": "planner.update_task",
      "kind": "effect",
      "operation": "update",
      "version": 1
    }
  ]
}
