[package]
name = "lekalo-core"
description = "Target-neutral request and result types for Lekalo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
saphyr-parser.workspace = true
unicode-normalization.workspace = true
semver = "1.0.28"
sha2 = "0.10.9"
rusqlite.workspace = true
jsonschema = { version = "=0.29.1", default-features = false }
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_UI_Shell"] }
