{
  "name": "lekalo-ci",
  "services": {
    "docker01": {
      "image": "docker:29-dind",
      "hostname": "lekalo-ci-docker-01",
      "privileged": true,
      "restart": "unless-stopped",
      "environment": {
        "DOCKER_TLS_CERTDIR": ""
      },
      "command": [
        "--storage-driver=overlay2",
        "--log-driver=json-file",
        "--log-opt=max-size=10m",
        "--log-opt=max-file=3"
      ],
      "cpus": 1,
      "mem_limit": "1536m",
      "memswap_limit": "1536m",
      "cgroup_parent": "lekalo-ci-worker01.slice",
      "volumes": [
        "docker-data-01:/var/lib/docker",
        "/srv/github-runners/lekalo/worker-01/_work:/srv/github-runners/lekalo/worker-01/_work"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "docker",
          "info"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "runner01": {
      "image": "local/lekalo-ci-runner:ubuntu24-20261022",
      "restart": "unless-stopped",
      "network_mode": "service:docker01",
      "depends_on": {
        "docker01": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "DOCKER_HOST": "tcp://127.0.0.1:2375",
        "RUNNER_ROOT": "/srv/github-runners/lekalo/worker-01",
        "CI_DOCKER_NAME": "lekalo-ci-docker-01",
        "ACTIONS_RUNNER_HOOK_JOB_STARTED": "/usr/local/bin/trust.sh",
        "ACTIONS_RUNNER_HOOK_JOB_COMPLETED": "/usr/local/bin/cleanup.sh",
        "CARGO_BUILD_JOBS": "1"
      },
      "cpus": 2,
      "mem_limit": "2560m",
      "memswap_limit": "2560m",
      "cgroup_parent": "lekalo-ci-worker01.slice",
      "volumes": [
        "/srv/github-runners/lekalo/worker-01:/srv/github-runners/lekalo/worker-01"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "build": {
        "context": "."
      }
    },
