name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for example v0.6.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  prepare:
    name: Verify release and resolve source commit
    runs-on: ubuntu-22.04
    outputs:
      source-commit: ${{ steps.release.outputs.source-commit }}
    steps:
      # Keep automation separate so manual dispatch can build older tags
      # which do not contain the release scripts themselves.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag, release title, Cargo versions and clean source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/release.mjs prepare

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the tagged CLI with the committed lockfile
        working-directory: source
        run: cargo build --release --locked -p lekalo-cli --bin lekalo --target ${{ matrix.target }}
      - name: Package and run the extracted executable
        run: node automation/scripts/release.mjs package
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Upload the complete verified release assets
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      # Resolve the tag again: never publish after it moved during a build.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all five archives and write SHA256SUMS.txt
        run: node automation/scripts/release.mjs collect
      - name: Upload assets and verify the downloaded release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/release.mjs publish
