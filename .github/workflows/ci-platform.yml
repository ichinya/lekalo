name: Platform CI

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  build-debug:
    name: "build-debug"
    runs-on: ${{ inputs.os }}
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: debug
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
      producer-attempt: ${{ steps.package.outputs.producer-attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-platform-build-debug
      - name: "Build runtime executables"
        run: |
          cargo build -p lekalo-cli --bin lekalo --locked
          cargo build -p lekalo-core --example typescript-native-contract --locked
      - name: "Package the runtime and bind its source"
        id: package
        run: |
          node scripts/ci-runtime-artifacts.mjs prepare "$RUNNER_TEMP/runtime-debug"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: runtime-debug-${{ inputs.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-debug/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  build-release:
    name: "build-release"
    runs-on: ${{ inputs.os }}
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: release
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
      producer-attempt: ${{ steps.package.outputs.producer-attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-platform-build-release
      - name: "Build runtime executables"
        run: |
          cargo build --release -p lekalo-cli --bin lekalo --locked
      - name: "Package the runtime and bind its source"
        id: package
        run: |
          node scripts/ci-runtime-artifacts.mjs prepare "$RUNNER_TEMP/runtime-release"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: runtime-release-${{ inputs.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-release/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  cli-core:
    name: "cli-core"
    runs-on: ${{ inputs.os }}
    needs: build-debug
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: debug
      LEKALO_CI_RUNTIME: required
      RUNTIME_PRODUCER_ATTEMPT: ${{ needs.build-debug.outputs.producer-attempt }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.build-debug.outputs.manifest-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - &ci-setup-7
        name: Use physical temporary paths for synthetic project fixtures
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          // The native Windows resolver also expands 8.3 names.
          const root = realpathSync.native(tmpdir());
          for (const name of ['TEMP', 'TMP', 'TMPDIR']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${root}\n`);
          }
          NODE
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-debug.outputs.artifact-id }}
          path: ${{ runner.temp }}/runtime-debug
          merge-multiple: true
      - name: "Verify and install runtime before gates"
        run: |
          node scripts/ci-runtime-artifacts.mjs verify "$RUNNER_TEMP/runtime-debug"
      - &ci-setup-6
        name: Provision PHP 8.3 (issue #54, visible setup step, no project install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Composer is needed on every OS by the issue #56 fixture
          # provisioning step (the locked vendor tree is not committed).
          tools: composer
          # The locked Laravel runtime of the issue #56 fixture needs its
          # platform extensions; every dependency-free suite is unaffected.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter, ctype, fileinfo, iconv, session
        id: php
      - &ci-setup-8
        name: Provision exact Ajv 8.20.0 outside the checkout (issues #32, #48)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
          export NODE_PATH="$RUNNER_TEMP/lekalo-ajv-8.20.0/node_modules"
          test "$(node -p "require('ajv/package.json').version")" = "8.20.0"
      - &ci-setup-9
        name: Provision the Linux process confinement backend
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - &ci-setup-10
        name: Load the CI-only AppArmor launcher prerequisite
        if: runner.os == 'Linux'
        id: apparmor
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bash .github/ci/bwrap-apparmor.sh load
      - &ci-setup-11
        name: Verify the Linux namespace backend before adapter probes
        if: runner.os == 'Linux'
        run: /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      - &ci-setup-26
        name: Provision the vendored compiler bundle custody (issue #44)
        run: |
          set -euo pipefail
          npm ci --prefix adapters/node-typescript --ignore-scripts --no-audit --no-fund
          node adapters/node-typescript/provision-compiler.mjs
          node adapters/node-typescript/build.mjs --check
      - &ci-setup-46
        name: Provision the planner fixture vendor tree per the committed lock (issues #52/#56)
        # Explicit setup, before both maintained-native and later adapter gates.
        # Runtime/compile processes never install packages or run lifecycle scripts.
        timeout-minutes: 15
        run: composer install --no-interaction --prefer-dist --no-scripts --working-dir tests/fixtures/php-laravel/planner
      - &ci-setup-35
        name: Provision ripgrep for the Windows search comparison
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rg --version
      - &ci-setup-36
        name: Provision ripgrep for the macOS search comparison
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install ripgrep
          rg --version
      - name: "Check platform CI ownership and artifact guards"
        run: |
          node --test scripts/ci-runtime-artifacts.test.mjs scripts/ci-platform.test.mjs scripts/ci-rust-tests.test.mjs scripts/ci-contracts-cli.test.mjs scripts/privacy-runtime-helpers.test.mjs scripts/lib/watch-target-probe.test.mjs
          node scripts/check-ci-platform.mjs
      - name: Reject provenance pipe stalls and unsafe Git custody
        timeout-minutes: 3
        run: |
          node scripts/test-fixture-git.mjs
          node scripts/test-fixture-provenance.mjs
      - name: Verify release packaging and publication guards
        run: node --test scripts/release.test.mjs
      - name: Run read-only watch native and poll probes (issue #95)
        id: watch
        timeout-minutes: 10
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-platform.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-boundaries.mjs
          node scripts/test-watch-equivalence.mjs
          node scripts/test-watch-faults.mjs
          node scripts/test-watch-successor.mjs
          node scripts/test-watch-consumers.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: failure() && steps.watch.outcome == 'failure' && runner.os != 'Windows'
      - name: Diagnose a failed watch lane with the synthetic confined runtime
        if: failure() && steps.watch.outcome == 'failure' && runner.os != 'Windows'
        run: cargo test -p lekalo-core --lib unix_confined_ --locked -- --nocapture
      - name: Run the live portability contract gate (issue #19)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-portability-contracts.mjs
      - name: Run neutral trace evidence and assessment contracts (issue #35)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-assessment-contracts.mjs --require-binary
      - name: Run the graph contract gate against the live binary (issue #52)
        # The Ajv job validates golden self-consistency without a build;
        # here the built CLI re-exports every pinned golden's owning
        # fixture and byte-compares the canonical rendering against the
        # pinned bytes, so a stale-but-schema-valid golden fails the Node
        # gate at the same commit the Rust golden tests would catch it.
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-graph-contracts.mjs --require-binary
      - name: Run the CI report smoke and gate (issue #103)
        # Dogfood the closed report surface on every OS: validate over a
        # fixture with all four report formats, the blocked readiness
        # gate, and the drift side-channel guarantee. The report bytes
        # are uploaded with the job artifacts (below). The report
        # directory is exported through the step env (never a plain
        # shell variable) so the Node assertions always see it, and the
        # upload names explicit finalized files guarded on existence.
        timeout-minutes: 5
        env:
          REPORTS: ${{ runner.temp }}/lekalo-ci-reports
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS"
          rm -rf target/ci-report-smoke
          cp -r tests/fixtures/loader/valid-direct-visibility target/ci-report-smoke
          cd target/ci-report-smoke
          BIN=../../target/debug/lekalo
          "$BIN" --version > /dev/null
          # validate: the passing run + the four projections.
          "$BIN" --json validate --report-file "$REPORTS/validate.json" --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.sarif" --report-format sarif --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.junit.xml" --report-format junit --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.md" --report-format md --project . > /dev/null
          node -e "const r=require(process.env.REPORTS + '/validate.json'); if (r.schema_version !== 'lekalo/ci-report/v0.6.3') process.exit(1); if (r.evaluation.verdict !== 'ready') process.exit(1);"
          # readiness --check: the blocked release gate is a nonzero exit
          # with the typed unavailable envelope, and its report still lands.
          set +e
          "$BIN" --json readiness --phase release --check --report-file "$REPORTS/readiness.json" --project . > "$REPORTS/readiness-envelope.txt" 2>&1
          code=$?
          set -e
          test "$code" -ne 0 || { echo 'blocked readiness --check must not exit 0'; exit 1; }
          node -e "const r=require(process.env.REPORTS + '/readiness.json'); if (r.evaluation.verdict !== 'blocked' || r.evaluation.exitCode === 0) process.exit(1);"
          # The canonical report identity and the exact digest spelling.
          node -e "const r=require(process.env.REPORTS + '/validate.json'); const c=require('crypto'); const h=c.createHash('sha256').update(JSON.stringify(r)+'\\n').digest('hex'); if (!/^[0-9a-f]{64}$/.test(h)) process.exit(1);"
          cd ../..
          echo "REPORTS_DIR=$REPORTS" >> "$GITHUB_ENV"
      - name: Upload the CI report artifacts (issue #103)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lekalo-ci-reports-${{ inputs.os }}-${{ github.run_attempt }}
          # Explicit finalized filenames from the confined report
          # directory: never a broad glob over the runner root, and a
          # missing destination fails the upload instead of widening.
          path: |
            ${{ runner.temp }}/lekalo-ci-reports/validate.json
            ${{ runner.temp }}/lekalo-ci-reports/validate.sarif
            ${{ runner.temp }}/lekalo-ci-reports/validate.junit.xml
            ${{ runner.temp }}/lekalo-ci-reports/validate.md
            ${{ runner.temp }}/lekalo-ci-reports/readiness.json
            ${{ runner.temp }}/lekalo-ci-reports/readiness-envelope.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run AI lint contract families (issue #76)
        id: ai-lint
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-report-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-config-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-waivers-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-comparison-contracts.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: failure() && steps.ai-lint.outcome == 'failure' && runner.os != 'Windows'
      - name: Diagnose a failed AI lint lane with the synthetic confined runtimes
        if: failure() && steps.ai-lint.outcome == 'failure' && runner.os != 'Windows'
        run: cargo test -p lekalo-core --lib unix_confined_ --locked -- --nocapture
      - name: Run scoped governance waiver contracts (issue #88)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-waivers-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-waiver-input-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-waiver-audit-contracts.mjs
      - name: Run the context-budget contract gate (issue #75)
        # Needs the binary built above; the schema-only Ajv list in the
        # contracts job never builds one (R2-B1).
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-context-budget-contracts.mjs
      - name: Run the coupling contract gate (issue #77)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-coupling-contracts.mjs
      - name: Run the module API boundary gate (issue #113)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-module-api-contracts.mjs
      - name: Run every Framework Lift family live gate (issue #100)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          for family in baseline task campaign arm result; do
            NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-framework-lift-contracts.mjs --family "$family"
          done
          node scripts/gen-framework-lift-v11.mjs --check
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-framework-lift-v11.mjs
      - name: Run the local run-history end-to-end gate (issue #121)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-run-history-cli.mjs
      - name: Run the semantic search live and benchmark gates (issue #93)
        # Every OS provisions ripgrep explicitly for the comparison leg.
        # The binary is the workspace build above. Both gates
        # fail closed when their inputs are missing.
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-search-cli.mjs
          node scripts/bench-search.mjs
      - name: Run the semantic change contract and live CLI gates (issue #73)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-cli.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-extended.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-bindings.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-errors.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-symbols.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-ownership.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ownership-contracts.mjs
          node scripts/test-ownership-transitions.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-defaults.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-enum-wire.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-query-inputs.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-command-results.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-emissions.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-query-input-bindings.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-query-transport-bindings.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-change-transactions.mjs
      - name: Run the versioned fix recipe contract and live CLI gates (issue #74)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-fix-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-fix-cli.mjs
      - name: Run the diagnostic explanation contract and live CLI gates (issue #96)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-explain-contracts.mjs
      - name: Run the architecture profile contract gate (issue #84)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-architecture-profile-contracts.mjs
      - name: Run the canonical formatter gates (issue #94)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-format-contracts.mjs
          node scripts/test-format-cli.mjs
          node scripts/test-format-atomic.mjs
          node scripts/test-format-portability.mjs
      - name: Run the managed ownership, custody and planner gates (issue #41)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/gen-managed-contracts.mjs --check
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-managed-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-managed-cli.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-managed-planner-e2e.mjs
      - name: Run the public metrics contract and live CLI gates (issue #102)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          for family in evaluation-export-input metrics-aggregation-definition public-metrics metrics-export-manifest metrics-export-preview; do
            NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-metrics-export-contracts.mjs --family "$family"
          done
      - name: Run the workflow-provider discovery boundary gate (issue #34)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-provider-contracts.mjs
      - name: Run the privacy evaluator parity gate (issue #119)
        run: node scripts/test-privacy-evaluator-parity.mjs
      - name: Run the privacy runtime CLI gate (issue #119)
        run: node scripts/test-privacy-runtime-cli.mjs
      - name: Run the privacy leak-corpus gate (issue #119)
        run: node scripts/test-privacy-leak-corpus.mjs
      - name: Run the classification CLI e2e gate (issue #87)
        run: node scripts/test-classification-cli.mjs
      - name: Run the golden fixture suite gates (issue #90)
        # The suite runs on every OS: byte-stable determinism lanes,
        # per-rule paired coverage with fresh execution receipts, the
        # P0 planner chain, the newline/separator normalization vectors
        # (they execute the CLI), and the digest-bound update-flow
        # rehearsal — all in external sandboxes against the binary
        # built above.
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        timeout-minutes: 20
        run: |
          node scripts/run-golden.mjs --verify
          node scripts/test-golden-normalization.mjs
          node scripts/test-golden-determinism.mjs
          node scripts/test-golden-diagnostic-coverage.mjs
          node scripts/test-golden-planner-e2e.mjs
          node scripts/test-reference-projects.mjs --static
          node scripts/test-reference-model.mjs
          node scripts/test-reference-contract.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-golden-update-policy.mjs
      - name: Run the issue-136 adoption gates against the real binary
        # The contracts gate (schemas + registry + live read-only
        # flows), the selective-refactor gate (verified apply with
        # real baseline/candidate runs, negatives, exact rollback,
        # forged-custody/drift/confinement/version probes, receipt
        # obstruction recovery, rollback preflight, temp hygiene), the
        # hybrid gate (three-mode conformed fixture, live conformance
        # freshness, executed provenance joins, recovery deferral), and
        # the tutorial replay (the documented walkthrough runs
        # verbatim). All need the binary built above.
        env:
