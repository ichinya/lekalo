      - name: Run the transport generator gate (issue #70)
        run: node scripts/test-node-typescript-transport.mjs
      - name: Run the OpenAPI generator gate (issue #46)
        run: node scripts/test-node-openapi.mjs
      - name: Run the scenario-test compiler gate (issue #47)
        run: node scripts/test-node-scenario-tests.mjs
      - name: Run the scenario unit suites (issue #47 review F-11)
        run: node scripts/test-node-scenario-units.mjs
      - name: Run the native gate contract gate (issue #48)
        env:
