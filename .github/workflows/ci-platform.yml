  rust:
    name: "rust"
    runs-on: ${{ inputs.os }}
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-platform-rust
      - *ci-setup-6
      - *ci-setup-90
      - *ci-setup-8
      - *ci-setup-9
      - *ci-setup-10
      - *ci-setup-11
      - *ci-setup-26
      - *ci-setup-46
      - *ci-setup-35
      - *ci-setup-36
      - run: cargo build --workspace --locked
      - name: Qualify confined Unix execution and denied host paths
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: cargo test -p lekalo-core --lib unix_confined_ --locked -- --nocapture
      - name: Qualify bounded Unix process and request-file lifecycle
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: cargo test -p lekalo-core --test target_transport_unix --locked -- --test-threads=1
      - name: Run the adapter containment suite (issue #89)
        timeout-minutes: 5
        # Serialized: the staging-cleanup assertions count live
        # lekalo-target-sandbox-* dirs in the shared temp dir, which only
        # reports our own run when no sibling test holds one.
        run: cargo test -p lekalo-core --test target_protocol_security --locked -- --test-threads=1
      - name: Run the remaining Rust tests without repeating qualification
        run: node scripts/ci-rust-tests.mjs --lane=core
      - *ci-setup-104

  rust-process:
    name: "rust-process"
    runs-on: ${{ inputs.os }}
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-platform-rust-process
      - *ci-setup-6
      - *ci-setup-90
      - *ci-setup-8
      - *ci-setup-9
      - *ci-setup-10
      - *ci-setup-11
      - *ci-setup-26
      - *ci-setup-46
      - *ci-setup-35
      - *ci-setup-36
      - run: cargo build --workspace --locked
      - name: Run CLI and Windows process fixtures independently
        run: node scripts/ci-rust-tests.mjs --lane=process
      - *ci-setup-104

  native-execution:
    name: "native-execution"
    runs-on: ${{ inputs.os }}
    needs: build-release
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: release
      LEKALO_CI_RUNTIME: required
      RUNTIME_PRODUCER_ATTEMPT: ${{ needs.build-release.outputs.producer-attempt }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.build-release.outputs.manifest-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact-id }}
          path: ${{ runner.temp }}/runtime-release
          merge-multiple: true
      - name: "Verify and install runtime before gates"
        run: |
          node scripts/ci-runtime-artifacts.mjs verify "$RUNNER_TEMP/runtime-release"
      - *ci-setup-8
      - *ci-setup-9
      - *ci-setup-10
      - *ci-setup-11
      - *ci-setup-26
      - name: Execute approved native plans through the release CLI (issue #151)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          node scripts/gen-native-execution-protocol.mjs --check
          node scripts/gen-native-execution-contracts.mjs --check
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-native-execution.mjs
      - name: Execute declared workspace tools through production verify (issue #156)
        timeout-minutes: 15
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
          LEKALO_NODE_TOOLS_HOME: ${{ runner.temp }}/lekalo-declared-node-tools
          LEKALO_NATIVE_REPORTS_DIR: ${{ runner.temp }}/lekalo-native-acceptance
        run: |
          set -euo pipefail
          node scripts/gen-node-native-contracts.mjs --check
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-node-native-tools.mjs --provision
      - name: "Qualify the clean MVP user workflow (issue #1)"
        timeout-minutes: 15
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
          LEKALO_NODE_TOOLS_HOME: ${{ runner.temp }}/lekalo-declared-node-tools
          LEKALO_NATIVE_REPORTS_DIR: ${{ runner.temp }}/lekalo-mvp-acceptance
        run: node scripts/test-mvp-workflow.mjs
      - name: Retain native plans and measured verify reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-acceptance-${{ inputs.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lekalo-native-acceptance/
            ${{ runner.temp }}/lekalo-mvp-acceptance/
          if-no-files-found: ignore
          retention-days: 14
      - *ci-setup-104
