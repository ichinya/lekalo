  php-laravel:
    name: "php-laravel"
    runs-on: ${{ inputs.os }}
    needs: build-debug
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: debug
      LEKALO_CI_RUNTIME: required
      RUNTIME_PRODUCER_ATTEMPT: ${{ needs.build-debug.outputs.producer-attempt }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.build-debug.outputs.manifest-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-debug.outputs.artifact-id }}
          path: ${{ runner.temp }}/runtime-debug
          merge-multiple: true
      - name: "Verify and install runtime before gates"
        run: |
          node scripts/ci-runtime-artifacts.mjs verify "$RUNNER_TEMP/runtime-debug"
      - *ci-setup-6
      - *ci-setup-8
      - *ci-setup-9
      - *ci-setup-10
      - *ci-setup-11
      - *ci-setup-26
      - *ci-setup-46
      - name: Run the task-links pilot gates (issue #52)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-task-links-contracts.mjs
          node scripts/test-task-links-scenarios.mjs
          node scripts/test-task-links-outbox.mjs
          node scripts/test-task-links-impact-portability.mjs
          node scripts/test-task-links-native.mjs
          node scripts/test-task-links-public-evidence.mjs
      - name: Run the provisioned task-links native gate (issue #52)
        # Executes the Rust/SQLite battery and the locked maintained Laravel
        # port in synchronized/killed/restarted worker processes. Only the live
        # owner can qualify its matching implementation/build/profile;
        # exported files/DB rows never authenticate a past native execution.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          LEKALO_TASKLINKS_NATIVE=1 \
            LEKALO_TASKLINKS_NATIVE_DB="$RUNNER_TEMP/tasklinks-native/provisioned.sqlite" \
            node scripts/test-task-links-native.mjs
          test -f "$RUNNER_TEMP/tasklinks-native/provisioned.sqlite.qualified.json"
      - name: Run the PHP types contract gate (issue #58)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: node scripts/test-php-types-contracts.mjs
      - name: Run the PHP/Laravel adapter suite (issue #54)
        # Runs on every OS: the PHP unit suites and packaging gate run
        # wherever PHP runs; the confined conformance battery proves for
        # real on Linux, and on macOS/Windows reports the platform's
        # confinement limitation as an explicit, logged skip.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-adapter.mjs
      - name: Run the PHP scenario binding custody gate (issue #56)
        # Scaffold-once and checked-binding semantics over the pure
        # compile exchange — needs PHP only, no vendor tree: generation
        # and verification never execute project code.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-scenario-bindings.mjs
      - name: Run the PHP type generation gate (issue #58)
        # The closed mapping, the three custody modes, and the golden
        # digests over the shared Planner corpus — needs PHP only.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-types.mjs
      - name: Run the PHP type round-trip gate (issue #58)
        # Executable codec vectors over both corpora; the Mago leg
        # records an honest skip here (the real-toolchain leg runs it
        # with --require-mago) and never counts as Mago acceptance.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-type-roundtrip.mjs
      - name: Run the Composer/Laravel native-gates harness (issue #61)
        # Pure planner legs on every OS: targeted selection, mandatory
        # cross-module gates, exactly-once suites, hostile decoder
        # probes, stale-custody zero-spawn refusals, and the release-
        # full fallback — driven in-process with process-launching
        # functions disabled, so zero-spawn claims are enforced by the
        # interpreter. The Rust `native run` parity leg runs when the
        # built binary is present; the confined runtime qualification
        # leg stays pending its operator/CI provisioning (research doc
        # section 8.5) and never fakes a pass.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-native-gates.mjs
      - name: Run the Mago integration gate, fake mode (issue #55)
        # Requires PHP but no Mago binary and no network: the receipt
        # decoder, the analysis states, and the strict-profile gates run
        # against the committed artifact with injected fakes.
        run: node scripts/test-mago-integration.mjs --fake
      - name: Run the Laratesto scenario E2E gate (issue #56)
        timeout-minutes: 10
        run: node scripts/test-php-laravel-scenario-tests.mjs
      - name: Run the Laravel routes runtime gate (issue #60)
        # The composed types + operations + routes generation through
        # the real adapter exchange, then the planner fixture serving
        # the Today/focus endpoints through the generated surface over
        # the real HTTP kernel (the provisioned vendor tree above).
        timeout-minutes: 15
        run: node scripts/test-php-laravel-routes.mjs
      - name: Run the Laravel migration pipeline gate (issue #57)
        # The pipeline stages (CLI goldens, PHP artifacts, custody)
        # run wherever the repo's gates run; the PostgreSQL execution
        # stage uses the docker engine available on the runner and
        # records an explicit skip when it is absent — never a pass.
        timeout-minutes: 15
        run: node scripts/test-php-laravel-migrations.mjs
      - name: Run the Node/Laravel scenario parity gate (issue #56)
        # Both backends run the same committed scenario corpus under
        # their real runners; the durable run records must normalize to
        # identical semantic row tuples, including the shared failing
        # mutation.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-parity.mjs
      - *ci-setup-104

