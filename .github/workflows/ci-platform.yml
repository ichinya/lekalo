          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-native-gate-contracts.mjs
      - name: Run the applicable conformance battery against the kernel adapter (bare)
        run: '"$LEKALO_DEBUG_BIN" adapter test --profile default --report junit -- node adapters/node-typescript/adapter.mjs'
      - name: Run the conformance battery against the configured scanner adapter (issue #44)
        run: |
          set -euo pipefail
          PROFILE_JSON=$(tr -d '[:space:]' < tests/fixtures/node-typescript-scanner/protocol/conformance.profile.json)
          "$LEKALO_DEBUG_BIN" adapter test --profile default --report junit -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON"
          "$LEKALO_DEBUG_BIN" adapter test --profile strict --report junit -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON" || test $? -eq 4
      - name: Run the conformance battery against the transport-configured adapter (issue #70)
        run: |
          set -euo pipefail
          PROFILE_JSON=$(tr -d '[:space:]' < tests/fixtures/node-typescript-transport/protocol/conformance.profile.json)
          "$LEKALO_DEBUG_BIN" adapter test --profile default --report json -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON"
      - name: Run the target adapter conformance suite against the reference adapter
        timeout-minutes: 10
        run: '"$LEKALO_DEBUG_BIN" adapter test --profile strict --report junit --timeout-ms 60000 node tests/fixtures/target-protocol/fake-adapter.mjs --lekalo-adapter-variant fluent'
