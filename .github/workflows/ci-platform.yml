    needs: build-debug
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: debug
      LEKALO_CI_RUNTIME: required
      RUNTIME_PRODUCER_ATTEMPT: ${{ needs.build-debug.outputs.producer-attempt }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.build-debug.outputs.manifest-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-debug.outputs.artifact-id }}
          path: ${{ runner.temp }}/runtime-debug
          merge-multiple: true
      - name: "Verify and install runtime before gates"
        run: |
          node scripts/ci-runtime-artifacts.mjs verify "$RUNNER_TEMP/runtime-debug"
      - *ci-setup-8
      - *ci-setup-9
      - *ci-setup-10
      - *ci-setup-11
      - name: Replay portable documentation commands in disposable copies (issue #105)
        timeout-minutes: 60
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          node scripts/test-docs-ownership.mjs
          node scripts/test-fixture-git.mjs
          node scripts/test-docs-examples.mjs
      - *ci-setup-104

  mcp:
    name: "mcp"
    runs-on: ${{ inputs.os }}
    needs: build-debug
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
      RUNTIME_PROFILE: debug
      LEKALO_CI_RUNTIME: required
      RUNTIME_PRODUCER_ATTEMPT: ${{ needs.build-debug.outputs.producer-attempt }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.build-debug.outputs.manifest-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-debug.outputs.artifact-id }}
          path: ${{ runner.temp }}/runtime-debug
          merge-multiple: true
      - name: "Verify and install runtime before gates"
        run: |
          node scripts/ci-runtime-artifacts.mjs verify "$RUNNER_TEMP/runtime-debug"
      - *ci-setup-8
      - name: Run the read-only MCP stdio gate (issue #33)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-stdio.mjs
          node scripts/test-mcp-notifications.mjs
      - name: Provision the qualified MCP host SDK outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/lekalo-mcp-sdk" --ignore-scripts --no-audit --no-fund --no-save @modelcontextprotocol/sdk@1.32.1
      - name: Qualify the real MCP host connection (issue #33)
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-mcp-sdk/node_modules
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          node scripts/test-mcp-host.mjs
          node scripts/test-context-successor.mjs
      - name: Provision the pinned AI Factory extension installer (issue #33)
        run: npm install --prefix "$RUNNER_TEMP/lekalo-ai-factory" --ignore-scripts --no-audit --no-fund --no-save ai-factory@2.19.0
      - name: Qualify the installed AI Factory extension (issue #33)
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-mcp-sdk/node_modules
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
          LEKALO_AI_FACTORY_DIR: ${{ runner.temp }}/lekalo-ai-factory/node_modules/ai-factory
        run: node scripts/test-mcp-ai-factory.mjs

  rust:
    name: "rust"
    runs-on: ${{ inputs.os }}
    env:
      RUNTIME_IMAGE: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - *ci-setup-7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-platform-rust
      - *ci-setup-8
      - *ci-setup-9
      - *ci-setup-10
      - *ci-setup-11
      - *ci-setup-26
      - *ci-setup-35
      - *ci-setup-36
      - name: Build pinned external services
        run: node scripts/external-tool.mjs --build-services
      - run: cargo build --workspace --locked
      - name: Build the core qualification test executable before its deadline
        run: cargo test -p lekalo-core --lib --no-run --locked
      - name: Qualify confined Unix execution and denied host paths
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: cargo test -p lekalo-core --lib unix_confined_ --locked -- --nocapture
      - name: Qualify bounded Unix process and request-file lifecycle
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: cargo test -p lekalo-core --test target_transport_unix --locked -- --test-threads=1
      - name: Run the adapter containment suite (issue #89)
        timeout-minutes: 5
        # Serialized: the staging-cleanup assertions count live
        # lekalo-target-sandbox-* dirs in the shared temp dir, which only
        # reports our own run when no sibling test holds one.
        run: cargo test -p lekalo-core --test target_protocol_security --locked -- --test-threads=1
      - name: Run the remaining Rust tests without repeating qualification
        run: node scripts/ci-rust-tests.mjs --lane=core
      - *ci-setup-104

