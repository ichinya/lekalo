name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision exact Ajv 8.17.1 and the OpenAPI validator outside the checkout
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.17.1" --ignore-scripts --no-audit --no-fund --no-save ajv@8.17.1 @seriousme/openapi-schema-validator@2.8.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1
          test "$(node -p "require('$RUNNER_TEMP/lekalo-ajv-8.17.1/node_modules/ajv/package.json').version")" = "8.17.1"
      - name: Run pinned Ajv schema release gate
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-model-ajv.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-lockfile-ajv.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-diagnostic-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-validation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-graph-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-scenario-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-effect-graph-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-assessment-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-inspect-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-artifact-manifest-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-cache-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-doctor-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ci-report-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-impact-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-context-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-semantic-diff-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-transaction-concurrency-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-authorization-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-error-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-client-sdk-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-extended-effects-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-invariant-transition-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-reference-evaluation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-projection-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-engine-profile-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-introspection-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-mysql-binding.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-engine-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-laravel-migration-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-observed-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-bindings-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-query-model-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-expressions-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-contracted-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-target-protocol-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-target-profile-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-requirements-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-nfr-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-classification-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-implementation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-orchestration-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-transport-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-openapi-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-run-history-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-workspace-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-provider-contracts.mjs
      - name: Execute protocol semantic vectors through production Rust decoding
        run: cargo test -p lekalo-core target_protocol_conformance --locked
      - name: Run contract checkers and suites
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          node scripts/check-contract-versions.mjs --base HEAD^
          node scripts/test-contract-versions.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-workspace-hook.mjs
          node scripts/check-authority.mjs
          node scripts/test-authority-contracts.mjs
          node scripts/test-authority-cli.mjs
          node scripts/test-authority-boundaries.mjs
          node scripts/check-privacy.mjs
          node scripts/test-privacy-contracts.mjs
          node scripts/test-privacy-cli.mjs
          node scripts/test-privacy-coherence.mjs
          node scripts/test-privacy-decisions.mjs
          node scripts/test-privacy-output-schema.mjs
          node scripts/test-privacy-schema-parity.mjs
          node scripts/test-privacy-review-regressions.mjs
          node scripts/test-privacy-authorizing-evidence.mjs
          node scripts/test-privacy-authorization-subject.mjs
          node scripts/test-fixture-provenance.mjs
      - name: Validate documentation ownership and replay metadata (issue #105)
        run: |
          node scripts/test-docs-ownership.mjs --static
          node scripts/test-docs-examples.mjs --static
      - name: Run the golden fixture suite catalog gates (issue #90)
        # Catalog/hygiene/adapter-shared are Node-only. The
        # normalization gate's newline/separator vectors execute the
        # cargo-built CLI, so it runs in build-test with the other
        # binary-dependent gates (the update-policy rehearsal too).
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-golden-catalog.mjs
          node scripts/test-golden-hygiene.mjs
          node scripts/test-golden-adapter-shared.mjs
          node scripts/check-structure.mjs
          node scripts/test-structure-contracts.mjs
          node scripts/check-model.mjs
          node scripts/test-model-contracts.mjs
          node scripts/test-versioning-contracts.mjs
          node scripts/test-lockfile-contracts.mjs
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Rust 1.80.0 MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: clippy
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Steps are written in bash; Windows runners default to pwsh otherwise.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Provision PHP 8.3 (issue #54, visible setup step, no project install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Composer is needed on every OS by the issue #56 fixture
          # provisioning step (the locked vendor tree is not committed).
          tools: composer
          # The locked Laravel runtime of the issue #56 fixture needs its
          # platform extensions; every dependency-free suite is unaffected.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter, ctype, fileinfo, iconv, session
        id: php
      - name: Provision exact Ajv 8.17.1 outside the checkout (issues #32, #48)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.17.1" --ignore-scripts --no-audit --no-fund --no-save ajv@8.17.1
          export NODE_PATH="$RUNNER_TEMP/lekalo-ajv-8.17.1/node_modules"
          test "$(node -p "require('ajv/package.json').version")" = "8.17.1"
      - name: Provision the Linux process confinement backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: cargo build --workspace --locked
      - name: Run neutral trace evidence and assessment contracts (issue #35)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-assessment-contracts.mjs --require-binary
      - name: Run the CI report smoke and gate (issue #103)
        # Dogfood the closed report surface on every OS: validate over a
        # fixture with all four report formats, the blocked readiness
        # gate, and the drift side-channel guarantee. The report bytes
        # are uploaded with the job artifacts (below). The report
        # directory is exported through the step env (never a plain
        # shell variable) so the Node assertions always see it, and the
        # upload names explicit finalized files guarded on existence.
        timeout-minutes: 5
        env:
          REPORTS: ${{ runner.temp }}/lekalo-ci-reports
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS"
          rm -rf target/ci-report-smoke
          cp -r tests/fixtures/loader/valid-direct-visibility target/ci-report-smoke
          cd target/ci-report-smoke
          BIN=../../target/debug/lekalo
          "$BIN" --version > /dev/null
          # validate: the passing run + the four projections.
          "$BIN" --json validate --report-file "$REPORTS/validate.json" --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.sarif" --report-format sarif --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.junit.xml" --report-format junit --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.md" --report-format md --project . > /dev/null
          node -e "const r=require(process.env.REPORTS + '/validate.json'); if (r.schema_version !== 'lekalo/ci-report/v0.6.3') process.exit(1); if (r.evaluation.verdict !== 'ready') process.exit(1);"
          # readiness --check: the blocked release gate is a nonzero exit
          # with the typed unavailable envelope, and its report still lands.
          set +e
          "$BIN" --json readiness --phase release --check --report-file "$REPORTS/readiness.json" --project . > "$REPORTS/readiness-envelope.txt" 2>&1
          code=$?
          set -e
          test "$code" -ne 0 || { echo 'blocked readiness --check must not exit 0'; exit 1; }
          node -e "const r=require(process.env.REPORTS + '/readiness.json'); if (r.evaluation.verdict !== 'blocked' || r.evaluation.exitCode === 0) process.exit(1);"
          # The canonical report identity and the exact digest spelling.
          node -e "const r=require(process.env.REPORTS + '/validate.json'); const c=require('crypto'); const h=c.createHash('sha256').update(JSON.stringify(r)+'\\n').digest('hex'); if (!/^[0-9a-f]{64}$/.test(h)) process.exit(1);"
          cd ../..
          echo "REPORTS_DIR=$REPORTS" >> "$GITHUB_ENV"
      - name: Upload the CI report artifacts (issue #103)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lekalo-ci-reports-${{ matrix.os }}-${{ github.run_attempt }}
          # Explicit finalized filenames from the confined report
          # directory: never a broad glob over the runner root, and a
          # missing destination fails the upload instead of widening.
          path: |
            ${{ runner.temp }}/lekalo-ci-reports/validate.json
            ${{ runner.temp }}/lekalo-ci-reports/validate.sarif
            ${{ runner.temp }}/lekalo-ci-reports/validate.junit.xml
            ${{ runner.temp }}/lekalo-ci-reports/validate.md
            ${{ runner.temp }}/lekalo-ci-reports/readiness.json
            ${{ runner.temp }}/lekalo-ci-reports/readiness-envelope.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run AI lint contract families (issue #76)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-report-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-config-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-waivers-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-comparison-contracts.mjs
      - name: Run the context-budget contract gate (issue #75)
        # Needs the binary built above; the schema-only Ajv list in the
        # contracts job never builds one (R2-B1).
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-context-budget-contracts.mjs
      - name: Run the coupling contract gate (issue #77)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-coupling-contracts.mjs
      - name: Run every Framework Lift family live gate (issue #100)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          for family in baseline task campaign arm result; do
            NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-framework-lift-contracts.mjs --family "$family"
          done
      - name: Run the local run-history end-to-end gate (issue #121)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-run-history-cli.mjs
      - name: Run the workflow-provider discovery boundary gate (issue #34)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-provider-contracts.mjs
      - name: Run the privacy evaluator parity gate (issue #119)
        run: node scripts/test-privacy-evaluator-parity.mjs
      - name: Run the privacy runtime CLI gate (issue #119)
        run: node scripts/test-privacy-runtime-cli.mjs
      - name: Run the privacy leak-corpus gate (issue #119)
        run: node scripts/test-privacy-leak-corpus.mjs
      - name: Run the classification CLI e2e gate (issue #87)
        run: node scripts/test-classification-cli.mjs
      - name: Load the CI-only AppArmor launcher prerequisite
        if: runner.os == 'Linux'
        id: apparmor
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          if sudo grep -Eq '^lekalo-ci-bwrap(-child)? ' /sys/kernel/security/apparmor/profiles; then
            exit 1
          fi
          sudo apparmor_parser --skip-cache --add .github/ci/bwrap.apparmor
      - name: Qualify confined Unix execution and denied host paths
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: cargo test -p lekalo-core --lib unix_confined_runtime_qualification --locked -- --nocapture
      - name: Qualify bounded Unix process and request-file lifecycle
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: cargo test -p lekalo-core --test target_transport_unix --locked -- --test-threads=1
      - name: Run the adapter containment suite (issue #89)
        timeout-minutes: 5
        # Serialized: the staging-cleanup assertions count live
        # lekalo-target-sandbox-* dirs in the shared temp dir, which only
        # reports our own run when no sibling test holds one.
        run: cargo test -p lekalo-core --test target_protocol_security --locked -- --test-threads=1
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Run the golden fixture suite gates (issue #90)
        # The suite runs on every OS: byte-stable determinism lanes,
        # per-rule paired coverage with fresh execution receipts, the
        # P0 planner chain, the newline/separator normalization vectors
        # (they execute the CLI), and the digest-bound update-flow
        # rehearsal — all in external sandboxes against the binary
        # built above.
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        timeout-minutes: 20
        run: |
          node scripts/run-golden.mjs --verify
          node scripts/test-golden-normalization.mjs
          node scripts/test-golden-determinism.mjs
          node scripts/test-golden-diagnostic-coverage.mjs
          node scripts/test-golden-planner-e2e.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-golden-update-policy.mjs
      - name: Replay portable documentation commands in disposable copies (issue #105)
        timeout-minutes: 15
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          node scripts/test-docs-ownership.mjs
          node scripts/test-docs-examples.mjs
      - name: Run the Node/TypeScript kernel suite (issue #43)
        run: node scripts/test-node-typescript-kernel.mjs
      - name: Run the adapter manifest contract gate (issue #32)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: node scripts/test-adapter-manifest-contracts.mjs
      - name: Run the PHP types contract gate (issue #58)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: node scripts/test-php-types-contracts.mjs
      - name: Verify the shipped adapter manifest golden (issue #32, #54)
        run: node scripts/test-adapter-manifest-golden.mjs
      - name: Run the PHP/Laravel adapter suite (issue #54)
        # Runs on every OS: the PHP unit suites and packaging gate run
        # wherever PHP runs; the confined conformance battery proves for
        # real on Linux, and on macOS/Windows reports the platform's
        # confinement limitation as an explicit, logged skip.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-adapter.mjs
      - name: Run the PHP scenario binding custody gate (issue #56)
        # Scaffold-once and checked-binding semantics over the pure
        # compile exchange — needs PHP only, no vendor tree: generation
        # and verification never execute project code.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-scenario-bindings.mjs
      - name: Run the PHP type generation gate (issue #58)
        # The closed mapping, the three custody modes, and the golden
        # digests over the shared Planner corpus — needs PHP only.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-types.mjs
      - name: Run the PHP type round-trip gate (issue #58)
        # Executable codec vectors over both corpora; the Mago leg
        # records an honest skip here (the real-toolchain leg runs it
        # with --require-mago) and never counts as Mago acceptance.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-type-roundtrip.mjs
      - name: Run the Composer/Laravel native-gates harness (issue #61)
        # Pure planner legs on every OS: targeted selection, mandatory
        # cross-module gates, exactly-once suites, hostile decoder
        # probes, stale-custody zero-spawn refusals, and the release-
        # full fallback — driven in-process with process-launching
        # functions disabled, so zero-spawn claims are enforced by the
        # interpreter. The Rust `native run` parity leg runs when the
        # built binary is present; the confined runtime qualification
        # leg stays pending its operator/CI provisioning (research doc
        # section 8.5) and never fakes a pass.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-native-gates.mjs
      - name: Run the Mago integration gate, fake mode (issue #55)
        # Requires PHP but no Mago binary and no network: the receipt
        # decoder, the analysis states, and the strict-profile gates run
        # against the committed artifact with injected fakes.
        run: node scripts/test-mago-integration.mjs --fake
      - name: Provision the planner fixture vendor tree per the committed lock (issue #56)
        # A provisioning step: install from the committed composer.lock,
        # never inside a compiler or adapter process, no lifecycle
        # scripts. The runtime gates stay offline afterwards.
        timeout-minutes: 15
        run: composer install --no-interaction --prefer-dist --no-scripts --working-dir tests/fixtures/php-laravel/planner
      - name: Run the Laratesto scenario E2E gate (issue #56)
        timeout-minutes: 10
        run: node scripts/test-php-laravel-scenario-tests.mjs
      - name: Run the Laravel routes runtime gate (issue #60)
        # The composed types + operations + routes generation through
        # the real adapter exchange, then the planner fixture serving
        # the Today/focus endpoints through the generated surface over
        # the real HTTP kernel (the provisioned vendor tree above).
        timeout-minutes: 15
        run: node scripts/test-php-laravel-routes.mjs
      - name: Run the Laravel migration pipeline gate (issue #57)
        # The pipeline stages (CLI goldens, PHP artifacts, custody)
        # run wherever the repo's gates run; the PostgreSQL execution
        # stage uses the docker engine available on the runner and
        # records an explicit skip when it is absent — never a pass.
        timeout-minutes: 15
        run: node scripts/test-php-laravel-migrations.mjs
      - name: Run the Node/Laravel scenario parity gate (issue #56)
        # Both backends run the same committed scenario corpus under
        # their real runners; the durable run records must normalize to
        # identical semantic row tuples, including the shared failing
        # mutation.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-parity.mjs
      - name: Provision the vendored compiler bundle custody (issue #44)
        run: |
          set -euo pipefail
          npm ci --prefix adapters/node-typescript --ignore-scripts --no-audit --no-fund
          node adapters/node-typescript/build.mjs --check
      - name: Run the TypeScript scanner suite (issue #44)
        run: node scripts/test-node-typescript-scanner.mjs
      - name: Run the Hono framework-binding suites (issue #115)
        timeout-minutes: 15
        run: node scripts/test-node-hono-bindings.mjs
      - name: Run the Hono read-only scan gate (issue #115)
        timeout-minutes: 10
        run: node scripts/test-node-hono-readonly.mjs
      - name: Run the Drizzle evidence suite (issue #116)
        run: node scripts/test-node-drizzle.mjs
      - name: Run the brownfield TypeScript pilot gate (issue #118)
        # The observed-mode pilot path end to end over the committed
        # synthetic consumer fixture: adopt dry-run purity, scan +
        # binding + projections, staleness on a controlled change, and
        # the closed privacy-safe metrics schema.
        timeout-minutes: 10
        run: node scripts/test-pilot-brownfield-ts.mjs
      - name: Run the Zod generator suite (issue #45)
        run: node scripts/test-node-zod-gen.mjs
      - name: Verify the generation artifact against the conformance battery (issue #45)
        run: |
          set -euo pipefail
          PROFILE_JSON=$(tr -d '[:space:]' < tests/fixtures/node-typescript-scanner/protocol/generation.profile.json)
          cargo run --locked -p lekalo-cli -- adapter test --profile default --report junit -- node adapters/node-typescript/adapter-zod.mjs --lekalo-project-profile-json "$PROFILE_JSON"
      - name: Run the native gate suite (issue #48)
        run: node scripts/test-node-native-gates.mjs
      - name: Run the transport generator gate (issue #70)
        run: node scripts/test-node-typescript-transport.mjs
      - name: Run the OpenAPI generator gate (issue #46)
        run: node scripts/test-node-openapi.mjs
      - name: Run the client-SDK generator gate (issue #72)
        run: node scripts/test-node-client-sdk.mjs
      - name: Provision the pinned Go toolchain for the client-SDK gate (issue #72)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.5"
      - name: Run the client-SDK runtime gate (issue #72)
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-client-sdk-vue" --ignore-scripts --no-audit --no-fund --no-save typescript@5.9.3 @vue/compiler-sfc@3.4.38
          # NODE_PATH is colon-delimited on POSIX and semicolon-delimited on Windows.
          delim=":"; if [ "$RUNNER_OS" = "Windows" ]; then delim=";"; fi
          NODE_PATH="$NODE_PATH$delim$RUNNER_TEMP/lekalo-client-sdk-vue/node_modules" node scripts/test-client-sdk-runtime.mjs
      - name: Replay the Laravel and Vue tutorial in a disposable copy (issue #105)
        timeout-minutes: 20
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          delim=":"; if [ "$RUNNER_OS" = "Windows" ]; then delim=";"; fi
          NODE_PATH="$NODE_PATH$delim$RUNNER_TEMP/lekalo-client-sdk-vue/node_modules" node scripts/test-docs-examples.mjs --lane planner
      - name: Run the scenario-test compiler gate (issue #47)
        run: node scripts/test-node-scenario-tests.mjs
      - name: Run the scenario unit suites (issue #47 review F-11)
        run: node scripts/test-node-scenario-units.mjs
      - name: Run the native gate contract gate (issue #48)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-native-gate-contracts.mjs
      - name: Execute the native gate host suites (issue #48)
        run: cargo test --locked -p lekalo-core --lib native_gate
      - name: Run the applicable conformance battery against the kernel adapter (bare)
        run: cargo run --locked -p lekalo-cli -- adapter test --profile default --report junit -- node adapters/node-typescript/adapter.mjs
      - name: Run the conformance battery against the configured scanner adapter (issue #44)
        run: |
          set -euo pipefail
          PROFILE_JSON=$(tr -d '[:space:]' < tests/fixtures/node-typescript-scanner/protocol/conformance.profile.json)
          cargo run --locked -p lekalo-cli -- adapter test --profile default --report junit -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON"
          cargo run --locked -p lekalo-cli -- adapter test --profile strict --report junit -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON" || test $? -eq 4
      - name: Run the conformance battery against the transport-configured adapter (issue #70)
        run: |
          set -euo pipefail
          PROFILE_JSON=$(tr -d '[:space:]' < tests/fixtures/node-typescript-transport/protocol/conformance.profile.json)
          cargo run --locked -p lekalo-cli -- adapter test --profile default --report json -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON"
      - name: Run the target adapter conformance suite against the reference adapter
        timeout-minutes: 10
        run: cargo run --locked -p lekalo-cli -- adapter test --profile strict --report junit --timeout-ms 60000 node tests/fixtures/target-protocol/fake-adapter.mjs --lekalo-adapter-variant fluent
      - name: Remove the CI-only AppArmor launcher prerequisite
        if: always() && runner.os == 'Linux' && steps.apparmor.outcome == 'success'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sudo apparmor_parser --skip-cache --remove .github/ci/bwrap.apparmor
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          if sudo grep -Eq '^lekalo-ci-bwrap(-child)? ' /sys/kernel/security/apparmor/profiles; then
            exit 1
          fi

  mysql-docs:
    name: Synthetic MySQL documentation tutorial (issue #105)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: lekalo_docs_tutorial
          MYSQL_USER: tutorial
          MYSQL_PASSWORD: synthetic-tutorial-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Build the locked CLI and provision the exact schema validator
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.17.1" --ignore-scripts --no-audit --no-fund --no-save ajv@8.17.1
      - name: Provision the synthetic fixture from its committed npm lock
        # Visible setup only; replay never installs or uses a production URL.
        run: npm ci --prefix tests/fixtures/pilot/brownfield-mysql --ignore-scripts --no-audit --no-fund
      - name: Replay actual-package typecheck, HTTP and MySQL persistence
        timeout-minutes: 10
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.17.1/node_modules
          LEKALO_DOCS_MYSQL_PORT: '3306'
        run: node scripts/test-docs-examples.mjs --lane mysql

  mago-real:
    name: Mago real-toolchain gate (issue #55)
    # The real-toolchain leg: installs the checksum-pinned Mago release
    # as a visible setup step outside the checkout, then runs the real
    # suite with --require-available. A missing tool fails this job; a
    # skipped leg is visible and never counts as Mago acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Provision PHP 8.3 (no extensions, no Composer tools)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Install the pinned Mago toolchain (checksum-verified, outside the checkout)
        run: |
          set -euo pipefail
          LOCK=adapters/php-laravel/mago-toolchain.lock.json
          PIN_VERSION=$(node -p "require('./$LOCK').tool.version")
          test "$PIN_VERSION" = "1.0.0"
          # Resolve THIS runner's platform entry from the lock — the
          # digest is custody, not decoration.
          read -r PLATFORM ARCHIVE WANT_SHA <<EOF
          $(node -e "
            const lock = require('./$LOCK');
            const platform = process.arch === 'arm64' && process.platform === 'darwin'
              ? 'aarch64-apple-darwin'
              : 'x86_64-unknown-linux-gnu';
            const artifact = lock.probe.artifacts.find((a) => a.platform === platform);
            if (!artifact) { console.error('no pinned artifact for ' + platform); process.exit(1); }
            console.log(artifact.platform, artifact.archive, artifact.archiveSha256);
          ")
          EOF
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/mago-archive" \
            "https://github.com/carthage-software/mago/releases/download/${PIN_VERSION}/${ARCHIVE}"
          # Fail-closed verification: the downloaded archive must match
          # the pinned digest byte for byte, or the job stops here.
          echo "${WANT_SHA}  $RUNNER_TEMP/mago-archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mago-bin"
          tar -xzf "$RUNNER_TEMP/mago-archive" -C "$RUNNER_TEMP/mago-bin"
          BIN=$(find "$RUNNER_TEMP/mago-bin" -type f -name mago | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LEKALO_MAGO=$BIN" >> "$GITHUB_ENV"
      - name: Run the Mago integration gate, real mode
        run: node scripts/test-mago-integration.mjs --real --require-available
      - name: Run the generated-types Mago gate, real mode (issue #58)
        # The generated type files pass the pinned lint AND analyze
        # gates, with the violating negative control proving the rules
        # ran. A missing tool fails this leg, never a silent skip.
        run: node scripts/test-php-laravel-type-roundtrip.mjs --require-mago
