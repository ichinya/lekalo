name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-version:
    name: Release tag and Cargo version parity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject a tag with a different Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE_DIR: .
        run: node scripts/release.mjs check-version

  contracts:
    name: Contracts (Node ${{ matrix.node-version }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          # The AI Workspace hook gate checks historical contract commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the checkout CLI for live contract probes
        run: cargo build --workspace --locked
      - name: Provision exact Ajv 8.20.0 and the OpenAPI validator outside the checkout
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0 @seriousme/openapi-schema-validator@2.8.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1
          test "$(node -p "require('$RUNNER_TEMP/lekalo-ajv-8.20.0/node_modules/ajv/package.json').version")" = "8.20.0"
      - name: Run pinned Ajv schema release gate
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-model-ajv.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-lockfile-ajv.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-diagnostic-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-validation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-graph-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-scenario-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-effect-graph-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-assessment-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-inspect-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-artifact-manifest-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-cache-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-doctor-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ci-report-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-impact-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-context-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-semantic-diff-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-transaction-concurrency-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-format-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-authorization-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-error-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-client-sdk-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-extended-effects-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-invariant-transition-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-task-links-contracts.mjs --schema-only
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-reference-evaluation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-projection-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-engine-profile-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-introspection-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-mysql-binding.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-engine-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-laravel-migration-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-observed-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-bindings-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-query-model-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-expressions-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-contracted-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-target-protocol-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-target-profile-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-requirements-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-nfr-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-classification-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-implementation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-orchestration-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-transport-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-openapi-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-run-history-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-search-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-workspace-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-provider-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-boundaries.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-union.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-explain-contracts.mjs --schema-only
      - name: Run the adapter-SDK schema, digest, and generator gates (issue #106)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        # CI permits only the read-only generator --check; --write stays a
        # local development action. The emitted outputs and records are
        # pinned by committed digests, so drift fails here.
        run: |
          set -euo pipefail
          node scripts/generate-adapter-sdk.mjs --check
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-adapter-sdk-contracts.mjs
      - name: Execute protocol semantic vectors through production Rust decoding
        run: cargo test -p lekalo-core target_protocol_conformance --locked
      - name: Run contract checkers and suites
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          node scripts/check-contract-versions.mjs --base HEAD^
          node scripts/check-registry-union.mjs
          node scripts/test-contract-versions.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-workspace-hook.mjs
          node scripts/check-authority.mjs
          node scripts/test-authority-contracts.mjs
          node scripts/test-authority-cli.mjs
          node scripts/test-authority-boundaries.mjs
          node scripts/check-privacy.mjs
          node scripts/test-privacy-contracts.mjs
          node scripts/test-privacy-cli.mjs
          node scripts/test-privacy-coherence.mjs
          node scripts/test-privacy-decisions.mjs
          node scripts/test-privacy-output-schema.mjs
          node scripts/test-privacy-schema-parity.mjs
          node scripts/test-privacy-review-regressions.mjs
          node scripts/test-privacy-authorizing-evidence.mjs
          node scripts/test-privacy-authorization-subject.mjs
          node scripts/test-fixture-provenance.mjs
          node scripts/test-fixture-git.mjs
          node scripts/test-schema-json.mjs
      - name: Validate documentation ownership and replay metadata (issue #105)
        run: |
          node scripts/test-docs-ownership.mjs --static
          node scripts/test-docs-examples.mjs --static
      - name: Run the golden fixture suite catalog gates (issue #90)
        # Catalog/hygiene/adapter-shared are Node-only. The
        # normalization gate's newline/separator vectors execute the
        # cargo-built CLI, so it runs in build-test with the other
        # binary-dependent gates (the update-policy rehearsal too).
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-golden-catalog.mjs
          node scripts/test-golden-hygiene.mjs
          node scripts/test-golden-adapter-shared.mjs
          node scripts/check-structure.mjs
          node scripts/test-structure-contracts.mjs
          node scripts/check-model.mjs
          node scripts/test-model-contracts.mjs
          node scripts/test-versioning-contracts.mjs
          node scripts/test-lockfile-contracts.mjs
  fmt:
    name: Rustfmt
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # The standalone adapter-SDK Rust workspace (sdk/rust, its own
      # [workspace]) is not covered by the root workspace (issue #106):
      # its generated modules pin their layout with #[rustfmt::skip], so
      # formatting can never fight the generator's byte --check.
      - name: Rustfmt (adapter SDK workspace)
        working-directory: sdk/rust
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (adapter SDK workspace)
        working-directory: sdk/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Rust 1.80.0 MSRV (${{ matrix.os }})
    runs-on: ${{ startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: clippy
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-test:
    name: Build and test (${{ matrix.os }})
    # This job validates host AppArmor and native process confinement. Keep
    # its original hosted OS matrix; Docker workers run the other Linux gates.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Steps are written in bash; Windows runners default to pwsh otherwise.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Reject provenance pipe stalls and unsafe Git custody
        timeout-minutes: 3
        run: |
          node scripts/test-fixture-git.mjs
          node scripts/test-fixture-provenance.mjs
      - name: Verify release packaging and publication guards
        run: node --test scripts/release.test.mjs
      - name: Provision PHP 8.3 (issue #54, visible setup step, no project install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Composer is needed on every OS by the issue #56 fixture
          # provisioning step (the locked vendor tree is not committed).
          tools: composer
          # The locked Laravel runtime of the issue #56 fixture needs its
          # platform extensions; every dependency-free suite is unaffected.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter, ctype, fileinfo, iconv, session
        id: php
      - name: Use physical temporary paths for synthetic project fixtures
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          // The native Windows resolver also expands 8.3 names.
          const root = realpathSync.native(tmpdir());
          for (const name of ['TEMP', 'TMP', 'TMPDIR']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${root}\n`);
          }
          NODE
      - name: Provision exact Ajv 8.20.0 outside the checkout (issues #32, #48)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
          export NODE_PATH="$RUNNER_TEMP/lekalo-ajv-8.20.0/node_modules"
          test "$(node -p "require('ajv/package.json').version")" = "8.20.0"
      - name: Provision the Linux process confinement backend
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Load the CI-only AppArmor launcher prerequisite
        if: runner.os == 'Linux'
        id: apparmor
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          if sudo grep -Eq '^lekalo-ci-bwrap(-child)? ' /sys/kernel/security/apparmor/profiles; then
            exit 1
          fi
          sudo apparmor_parser --skip-cache --add .github/ci/bwrap.apparmor
      - name: Verify the Linux namespace backend before adapter probes
        if: runner.os == 'Linux'
        run: /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      - run: cargo build --workspace --locked
      - name: Run read-only watch native and poll probes (issue #95)
        id: watch
        timeout-minutes: 10
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-platform.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-boundaries.mjs
          node scripts/test-watch-equivalence.mjs
          node scripts/test-watch-faults.mjs
          node scripts/test-watch-successor.mjs
          node scripts/test-watch-consumers.mjs
      - name: Diagnose a failed watch lane with the synthetic confined runtime
        if: failure() && steps.watch.outcome == 'failure' && runner.os != 'Windows'
        run: cargo test -p lekalo-core --lib unix_confined_ --locked -- --nocapture
      - name: Run the read-only MCP stdio gate (issue #33)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-stdio.mjs
          node scripts/test-mcp-notifications.mjs
      - name: Provision the qualified MCP host SDK outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/lekalo-mcp-sdk" --ignore-scripts --no-audit --no-fund --no-save @modelcontextprotocol/sdk@1.32.1
      - name: Qualify the real MCP host connection (issue #33)
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-mcp-sdk/node_modules
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          node scripts/test-mcp-host.mjs
          node scripts/test-context-successor.mjs
      - name: Provision the pinned AI Factory extension installer (issue #33)
        run: npm install --prefix "$RUNNER_TEMP/lekalo-ai-factory" --ignore-scripts --no-audit --no-fund --no-save ai-factory@2.19.0
      - name: Qualify the installed AI Factory extension (issue #33)
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-mcp-sdk/node_modules
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
          LEKALO_AI_FACTORY_DIR: ${{ runner.temp }}/lekalo-ai-factory/node_modules/ai-factory
        run: node scripts/test-mcp-ai-factory.mjs
      - name: Run the live portability contract gate (issue #19)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-portability-contracts.mjs
      - name: Run neutral trace evidence and assessment contracts (issue #35)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-assessment-contracts.mjs --require-binary
      - name: Run the graph contract gate against the live binary (issue #52)
        # The Ajv job validates golden self-consistency without a build;
        # here the built CLI re-exports every pinned golden's owning
        # fixture and byte-compares the canonical rendering against the
        # pinned bytes, so a stale-but-schema-valid golden fails the Node
        # gate at the same commit the Rust golden tests would catch it.
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-graph-contracts.mjs --require-binary
      - name: Run the CI report smoke and gate (issue #103)
        # Dogfood the closed report surface on every OS: validate over a
        # fixture with all four report formats, the blocked readiness
        # gate, and the drift side-channel guarantee. The report bytes
        # are uploaded with the job artifacts (below). The report
        # directory is exported through the step env (never a plain
        # shell variable) so the Node assertions always see it, and the
        # upload names explicit finalized files guarded on existence.
        timeout-minutes: 5
        env:
          REPORTS: ${{ runner.temp }}/lekalo-ci-reports
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS"
          rm -rf target/ci-report-smoke
          cp -r tests/fixtures/loader/valid-direct-visibility target/ci-report-smoke
          cd target/ci-report-smoke
          BIN=../../target/debug/lekalo
          "$BIN" --version > /dev/null
          # validate: the passing run + the four projections.
          "$BIN" --json validate --report-file "$REPORTS/validate.json" --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.sarif" --report-format sarif --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.junit.xml" --report-format junit --project . > /dev/null
          "$BIN" --json validate --report-file "$REPORTS/validate.md" --report-format md --project . > /dev/null
          node -e "const r=require(process.env.REPORTS + '/validate.json'); if (r.schema_version !== 'lekalo/ci-report/v0.6.3') process.exit(1); if (r.evaluation.verdict !== 'ready') process.exit(1);"
          # readiness --check: the blocked release gate is a nonzero exit
          # with the typed unavailable envelope, and its report still lands.
          set +e
          "$BIN" --json readiness --phase release --check --report-file "$REPORTS/readiness.json" --project . > "$REPORTS/readiness-envelope.txt" 2>&1
          code=$?
          set -e
          test "$code" -ne 0 || { echo 'blocked readiness --check must not exit 0'; exit 1; }
          node -e "const r=require(process.env.REPORTS + '/readiness.json'); if (r.evaluation.verdict !== 'blocked' || r.evaluation.exitCode === 0) process.exit(1);"
          # The canonical report identity and the exact digest spelling.
          node -e "const r=require(process.env.REPORTS + '/validate.json'); const c=require('crypto'); const h=c.createHash('sha256').update(JSON.stringify(r)+'\\n').digest('hex'); if (!/^[0-9a-f]{64}$/.test(h)) process.exit(1);"
          cd ../..
          echo "REPORTS_DIR=$REPORTS" >> "$GITHUB_ENV"
      - name: Upload the CI report artifacts (issue #103)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lekalo-ci-reports-${{ matrix.os }}-${{ github.run_attempt }}
          # Explicit finalized filenames from the confined report
          # directory: never a broad glob over the runner root, and a
          # missing destination fails the upload instead of widening.
          path: |
            ${{ runner.temp }}/lekalo-ci-reports/validate.json
            ${{ runner.temp }}/lekalo-ci-reports/validate.sarif
            ${{ runner.temp }}/lekalo-ci-reports/validate.junit.xml
            ${{ runner.temp }}/lekalo-ci-reports/validate.md
            ${{ runner.temp }}/lekalo-ci-reports/readiness.json
            ${{ runner.temp }}/lekalo-ci-reports/readiness-envelope.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run AI lint contract families (issue #76)
        id: ai-lint
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-report-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-config-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-waivers-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-lint-comparison-contracts.mjs
      - name: Diagnose a failed AI lint lane with the synthetic confined runtimes
        if: failure() && steps.ai-lint.outcome == 'failure' && runner.os != 'Windows'
        run: cargo test -p lekalo-core --lib unix_confined_ --locked -- --nocapture
      - name: Run scoped governance waiver contracts (issue #88)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-waivers-contracts.mjs
