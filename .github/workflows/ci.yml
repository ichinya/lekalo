name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Full debug symbols make every Rust test executable expensive to link on
# Windows. This changes symbol generation only; runtime checks stay enabled.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

# A superseded run of this suite is dead weight: cancel it everywhere
# except main, where each push keeps a complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-version:
    name: Release tag and Cargo version parity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject a tag with a different Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE_DIR: .
        run: node scripts/release.mjs check-version

  contracts-rust:
    name: Contracts Rust producer
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Keep the trusted worker's Cargo target outside checkout cleanup
        if: runner.environment == 'self-hosted'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync } from 'node:fs';
          import { resolve } from 'node:path';
          const target = resolve(process.env.RUNNER_TEMP, '..', '.lekalo-contracts-target');
          mkdirSync(target, { recursive: true });
          appendFileSync(process.env.GITHUB_ENV, `CARGO_TARGET_DIR=${target}\n`);
          NODE
      - name: Verify the trusted image's installed stable toolchain
        if: runner.environment == 'self-hosted'
        run: |
          rustup run stable rustc --version
          rustup run stable cargo --version
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: contracts-rust
      - name: Build the checkout CLI for live contract probes
        run: cargo build --workspace --locked
      # Protocol semantic vectors belong to core-lib in Build and test on all
      # three OSes. Do not compile that full unit-test executable again here.
      - name: Package the CLI with its checkout SHA and content digest
        run: node scripts/ci-contracts-cli.mjs prepare target/contracts-cli --strip
      - name: Share the verified Contracts CLI
        uses: actions/upload-artifact@v7
        with:
          name: contracts-cli
          path: target/contracts-cli/
          if-no-files-found: error
          retention-days: 1

  contracts:
    name: Contracts (Node ${{ matrix.node-version }})
    needs: contracts-rust
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          # The AI Workspace hook gate checks historical contract commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Receive the checkout CLI from the Rust producer
        uses: actions/download-artifact@v8
        with:
          name: contracts-cli
          path: target/debug
      - name: Verify CLI provenance before any contract probe executes
        run: node scripts/ci-contracts-cli.mjs verify target/debug
      - name: Provision exact Ajv 8.20.0 and the OpenAPI validator outside the checkout
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0 @seriousme/openapi-schema-validator@2.8.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1
          test "$(node -p "require('$RUNNER_TEMP/lekalo-ajv-8.20.0/node_modules/ajv/package.json').version")" = "8.20.0"
      - name: Run pinned Ajv schema release gate
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-model-ajv.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-lockfile-ajv.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-diagnostic-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-validation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-graph-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-scenario-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-effect-graph-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-evidence-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-trace-assessment-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-inspect-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-artifact-manifest-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-cache-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-doctor-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ci-report-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-impact-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-context-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-semantic-diff-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-transaction-concurrency-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-format-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-watch-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-authorization-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-error-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-client-sdk-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-extended-effects-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-invariant-transition-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-task-links-contracts.mjs --schema-only
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-reference-evaluation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-projection-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-engine-profile-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-introspection-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-mysql-binding.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-storage-engine-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-laravel-migration-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-observed-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-bindings-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-query-model-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-expressions-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-contracted-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-target-protocol-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-target-profile-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-requirements-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-nfr-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-classification-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-implementation-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-orchestration-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-transport-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-openapi-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-run-history-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-search-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-workspace-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-provider-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-boundaries.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-mcp-union.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-contracts.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-explain-contracts.mjs --schema-only
      - name: Run the adapter-SDK schema, digest, and generator gates (issue #106)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        # CI permits only the read-only generator --check; --write stays a
        # local development action. The emitted outputs and records are
        # pinned by committed digests, so drift fails here.
        run: |
          set -euo pipefail
          node scripts/generate-adapter-sdk.mjs --check
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-adapter-sdk-contracts.mjs
      - name: Run contract checkers and suites
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          node scripts/check-contract-versions.mjs --base HEAD^
          node scripts/check-registry-union.mjs
          node scripts/test-contract-versions.mjs
          node --test scripts/ci-rust-tests.test.mjs
          node --test scripts/ci-contracts-cli.test.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-ai-workspace-hook.mjs
          node scripts/check-authority.mjs
          node scripts/test-authority-contracts.mjs
          node scripts/test-authority-cli.mjs
          node scripts/test-authority-boundaries.mjs
          node scripts/check-privacy.mjs
          node scripts/test-privacy-contracts.mjs
          node scripts/test-privacy-cli.mjs
          node scripts/test-privacy-coherence.mjs
          node scripts/test-privacy-decisions.mjs
          node scripts/test-privacy-output-schema.mjs
          node scripts/test-privacy-schema-parity.mjs
          node scripts/test-privacy-review-regressions.mjs
          node scripts/test-privacy-authorizing-evidence.mjs
          node scripts/test-privacy-authorization-subject.mjs
          node scripts/test-fixture-provenance.mjs
          node scripts/test-fixture-git.mjs
          node scripts/test-schema-json.mjs
      - name: Validate documentation ownership and replay metadata (issue #105)
        run: |
          node scripts/test-docs-ownership.mjs --static
          node scripts/test-docs-examples.mjs --static
      - name: Run the golden fixture suite catalog gates (issue #90)
        # Catalog/hygiene/adapter-shared are Node-only. The
        # normalization gate's newline/separator vectors execute the
        # cargo-built CLI, so it runs in build-test with the other
        # binary-dependent gates (the update-policy rehearsal too).
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-golden-catalog.mjs
          node scripts/test-golden-hygiene.mjs
          node scripts/test-golden-adapter-shared.mjs
          node scripts/check-structure.mjs
          node scripts/test-structure-contracts.mjs
          node scripts/check-model.mjs
          node scripts/test-model-contracts.mjs
          node scripts/test-versioning-contracts.mjs
          node scripts/test-lockfile-contracts.mjs
  fmt:
    name: Rustfmt
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # The standalone adapter-SDK Rust workspace (sdk/rust, its own
      # [workspace]) is not covered by the root workspace (issue #106):
      # its generated modules pin their layout with #[rustfmt::skip], so
      # formatting can never fight the generator's byte --check.
      - name: Rustfmt (adapter SDK workspace)
        working-directory: sdk/rust
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (adapter SDK workspace)
        working-directory: sdk/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Rust 1.89.0 MSRV (${{ matrix.os }})
    runs-on: ${{ startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  platform:
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    uses: ./.github/workflows/ci-platform.yml
    with:
      os: ${{ matrix.os }}

  mysql-docs:
    name: Synthetic MySQL documentation tutorial (issue #105)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: lekalo_docs_tutorial
          MYSQL_USER: tutorial
          MYSQL_PASSWORD: synthetic-tutorial-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Build the locked CLI and provision the exact schema validator
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
      - name: Provision the synthetic fixture from its committed npm lock
        # Visible setup only; replay never installs or uses a production URL.
        run: npm ci --prefix tests/fixtures/pilot/brownfield-mysql --ignore-scripts --no-audit --no-fund
      - name: Replay actual-package typecheck, HTTP and MySQL persistence
        timeout-minutes: 10
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
          LEKALO_DOCS_MYSQL_PORT: '3306'
        run: node scripts/test-docs-examples.mjs --lane mysql

  postgres-migrations:
    name: PostgreSQL migration execution lane (issue #57)
    # The migration gate's stage 3 executes the emitted up()/down()
    # SQL on a real server. The build-test lanes reach it only when a
    # docker engine happens to exist; this job provisions a
    # digest-pinned services: PostgreSQL and hands it to the harness
    # through LEKALO_MIGRATIONS_PG*, so execution is guaranteed and
    # the server version stops floating with the postgres:16-alpine
    # tag. A configured-but-unreachable service fails the harness
    # (db:service-execution) — never a silent skip.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: lekalo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lekalo"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Provision the PostgreSQL client tools
        # The harness drives the service through the runner's psql;
        # ubuntu-latest ships it, the self-hosted image may not.
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
          pg_isready --version
      - name: Build the locked CLI and run the migration pipeline gate
        env:
          LEKALO_MIGRATIONS_PGHOST: localhost
          LEKALO_MIGRATIONS_PGPORT: '5432'
          LEKALO_MIGRATIONS_PGUSER: postgres
          LEKALO_MIGRATIONS_PGPASSWORD: synthetic-ci-only
          LEKALO_MIGRATIONS_PGDATABASE: lekalo
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          node scripts/test-php-laravel-migrations.mjs

  mago-real:
    name: Mago real-toolchain gate (issue #55)
    # The real-toolchain leg: installs the checksum-pinned Mago release
    # as a visible setup step outside the checkout, then runs the real
    # suite with --require-available. A missing tool fails this job; a
    # skipped leg is visible and never counts as Mago acceptance.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Provision PHP 8.3 (no extensions, no Composer tools)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Install the pinned Mago toolchain (checksum-verified, outside the checkout)
        run: |
          set -euo pipefail
          LOCK=adapters/php-laravel/mago-toolchain.lock.json
          PIN_VERSION=$(node -p "require('./$LOCK').tool.version")
          test "$PIN_VERSION" = "1.0.0"
          # Resolve THIS runner's platform entry from the lock — the
          # digest is custody, not decoration.
          read -r PLATFORM ARCHIVE WANT_SHA <<EOF
          $(node -e "
            const lock = require('./$LOCK');
            const platform = process.arch === 'arm64' && process.platform === 'darwin'
              ? 'aarch64-apple-darwin'
              : 'x86_64-unknown-linux-gnu';
            const artifact = lock.probe.artifacts.find((a) => a.platform === platform);
            if (!artifact) { console.error('no pinned artifact for ' + platform); process.exit(1); }
            console.log(artifact.platform, artifact.archive, artifact.archiveSha256);
          ")
          EOF
          ARCHIVE_CACHE="$RUNNER_TOOL_CACHE/mago-archives/$WANT_SHA/$ARCHIVE"
          if test -f "$ARCHIVE_CACHE"; then
            cp "$ARCHIVE_CACHE" "$RUNNER_TEMP/mago-archive"
          else
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/mago-archive" \
              "https://github.com/carthage-software/mago/releases/download/${PIN_VERSION}/${ARCHIVE}"
          fi
          # Fail-closed verification: the downloaded archive must match
          # the pinned digest byte for byte, or the job stops here.
          echo "${WANT_SHA}  $RUNNER_TEMP/mago-archive" | sha256sum --check --strict
          if test -w "$RUNNER_TOOL_CACHE"; then
            mkdir -p "$(dirname "$ARCHIVE_CACHE")"
            cp "$RUNNER_TEMP/mago-archive" "$ARCHIVE_CACHE"
          fi
          mkdir -p "$RUNNER_TEMP/mago-bin"
          tar -xzf "$RUNNER_TEMP/mago-archive" -C "$RUNNER_TEMP/mago-bin"
          BIN=$(find "$RUNNER_TEMP/mago-bin" -type f -name mago | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LEKALO_MAGO=$BIN" >> "$GITHUB_ENV"
      - name: Run the Mago integration gate, real mode
        run: node scripts/test-mago-integration.mjs --real --require-available
      - name: Run the generated-types Mago gate, real mode (issue #58)
        # The generated type files pass the pinned lint AND analyze
        # gates, with the violating negative control proving the rules
        # ran. A missing tool fails this leg, never a silent skip.
        run: node scripts/test-php-laravel-type-roundtrip.mjs --require-mago

  worklog-changelog-pilot:
    name: Worklog-changelog pilot binary gates (issue #51)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Build the locked CLI and provision the exact schema validator
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
      - name: Run the pilot harness, impact, and neutrality gates
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target php --profile strict --case all
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target go --profile strict --case all --expect-denied
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target go --profile permissive --case all
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-impact.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-admission.mjs
          node scripts/test-worklog-changelog-neutrality.mjs
