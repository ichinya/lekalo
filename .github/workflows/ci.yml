          PROFILE_JSON=$(tr -d '[:space:]' < tests/fixtures/node-typescript-transport/protocol/conformance.profile.json)
          cargo run --locked -p lekalo-cli -- adapter test --profile default --report json -- node adapters/node-typescript/adapter.mjs --lekalo-project-profile-json "$PROFILE_JSON"
      - name: Run the target adapter conformance suite against the reference adapter
        timeout-minutes: 10
        run: cargo run --locked -p lekalo-cli -- adapter test --profile strict --report junit --timeout-ms 60000 node tests/fixtures/target-protocol/fake-adapter.mjs --lekalo-adapter-variant fluent
      - name: Run the adapter-SDK vector parity gate (issue #106)
        # Four provisioned runtimes (Node ships with the runner, Go/PHP
        # are provisioned above, Rust by the toolchain step) replay the
        # shared corpus; a missing runtime is a failed setup, not a skip.
        # The lane also runs the real per-language lifecycle lanes, the
        # file-transport exchange, and the full-corpus production oracle
        # (issue #106 review r2 #8/#10).
        timeout-minutes: 15
        run: node scripts/test-adapter-sdk-vectors.mjs --language all
      - name: Run the adapter-SDK Go unit smoke (issue #106 review r2 #17)
        # The Go SDK ships its own smoke suite beside the vectors runner
        # so `go test ./...` exercises the runtime directly.
        run: go test ./...
        working-directory: sdk/go
      - name: Run the adapter-SDK conformance and package gates (issue #106)
        # The host binary was built above in this job, so the confined
        # strict battery, the feature-limited examples, and the packed
        # release-candidate verification run on every OS.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          node scripts/test-adapter-sdk-conformance.mjs --language all --profile strict --repeats 3 --timeout-ms 60000
          node scripts/test-adapter-sdk-packages.mjs --verify
      - name: Remove the CI-only AppArmor launcher prerequisite
        if: always() && runner.os == 'Linux' && steps.apparmor.outcome == 'success'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sudo apparmor_parser --skip-cache --remove .github/ci/bwrap.apparmor
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          if sudo grep -Eq '^lekalo-ci-bwrap(-child)? ' /sys/kernel/security/apparmor/profiles; then
            exit 1
          fi

  mysql-docs:
    name: Synthetic MySQL documentation tutorial (issue #105)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: lekalo_docs_tutorial
          MYSQL_USER: tutorial
          MYSQL_PASSWORD: synthetic-tutorial-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Build the locked CLI and provision the exact schema validator
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
      - name: Provision the synthetic fixture from its committed npm lock
        # Visible setup only; replay never installs or uses a production URL.
        run: npm ci --prefix tests/fixtures/pilot/brownfield-mysql --ignore-scripts --no-audit --no-fund
      - name: Replay actual-package typecheck, HTTP and MySQL persistence
        timeout-minutes: 10
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
          LEKALO_DOCS_MYSQL_PORT: '3306'
        run: node scripts/test-docs-examples.mjs --lane mysql

  mago-real:
    name: Mago real-toolchain gate (issue #55)
    # The real-toolchain leg: installs the checksum-pinned Mago release
    # as a visible setup step outside the checkout, then runs the real
    # suite with --require-available. A missing tool fails this job; a
    # skipped leg is visible and never counts as Mago acceptance.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Provision PHP 8.3 (no extensions, no Composer tools)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Install the pinned Mago toolchain (checksum-verified, outside the checkout)
        run: |
          set -euo pipefail
          LOCK=adapters/php-laravel/mago-toolchain.lock.json
          PIN_VERSION=$(node -p "require('./$LOCK').tool.version")
          test "$PIN_VERSION" = "1.0.0"
          # Resolve THIS runner's platform entry from the lock — the
          # digest is custody, not decoration.
          read -r PLATFORM ARCHIVE WANT_SHA <<EOF
          $(node -e "
            const lock = require('./$LOCK');
            const platform = process.arch === 'arm64' && process.platform === 'darwin'
              ? 'aarch64-apple-darwin'
              : 'x86_64-unknown-linux-gnu';
            const artifact = lock.probe.artifacts.find((a) => a.platform === platform);
            if (!artifact) { console.error('no pinned artifact for ' + platform); process.exit(1); }
            console.log(artifact.platform, artifact.archive, artifact.archiveSha256);
          ")
          EOF
          ARCHIVE_CACHE="$RUNNER_TOOL_CACHE/mago-archives/$WANT_SHA/$ARCHIVE"
          if test -f "$ARCHIVE_CACHE"; then
            cp "$ARCHIVE_CACHE" "$RUNNER_TEMP/mago-archive"
          else
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/mago-archive" \
              "https://github.com/carthage-software/mago/releases/download/${PIN_VERSION}/${ARCHIVE}"
          fi
          # Fail-closed verification: the downloaded archive must match
          # the pinned digest byte for byte, or the job stops here.
          echo "${WANT_SHA}  $RUNNER_TEMP/mago-archive" | sha256sum --check --strict
          if test -w "$RUNNER_TOOL_CACHE"; then
            mkdir -p "$(dirname "$ARCHIVE_CACHE")"
            cp "$RUNNER_TEMP/mago-archive" "$ARCHIVE_CACHE"
          fi
          mkdir -p "$RUNNER_TEMP/mago-bin"
          tar -xzf "$RUNNER_TEMP/mago-archive" -C "$RUNNER_TEMP/mago-bin"
          BIN=$(find "$RUNNER_TEMP/mago-bin" -type f -name mago | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LEKALO_MAGO=$BIN" >> "$GITHUB_ENV"
      - name: Run the Mago integration gate, real mode
        run: node scripts/test-mago-integration.mjs --real --require-available
      - name: Run the generated-types Mago gate, real mode (issue #58)
        # The generated type files pass the pinned lint AND analyze
        # gates, with the violating negative control proving the rules
        # ran. A missing tool fails this leg, never a silent skip.
        run: node scripts/test-php-laravel-type-roundtrip.mjs --require-mago

  worklog-changelog-pilot:
    name: Worklog-changelog pilot binary gates (issue #51)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","videos5-lekalo"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Build the locked CLI and provision the exact schema validator
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
      - name: Run the pilot harness, impact, and neutrality gates
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target php --profile strict --case all
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target go --profile strict --case all --expect-denied
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target go --profile permissive --case all
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-impact.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-admission.mjs
          node scripts/test-worklog-changelog-neutrality.mjs
