name: Linux confinement qualification

on:
  push:
    branches: [ci/ubuntu-26.04-bwrap]
    paths:
      - .github/ci/**
      - .github/workflows/linux-confinement.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: AppArmor launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Provision the confined launcher
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-utils
      - name: Record the hosted image and installed policies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/confinement"
          {
            cat /etc/os-release
            uname -a
            /usr/bin/bwrap --version
            apparmor_parser --version
            sysctl kernel.apparmor_restrict_unprivileged_userns
            cat /proc/self/attr/current
            sudo cat /sys/kernel/security/apparmor/profiles
            for policy in /etc/apparmor.d/*bwrap*; do
              if test -f "$policy"; then
                printf '\nPolicy: %s\n' "$policy"
                cat "$policy"
              fi
            done
          } | tee "$RUNNER_TEMP/confinement/host.txt"
      - name: Load the existing CI profile
        run: sudo apparmor_parser --skip-cache --add .github/ci/bwrap.apparmor
      - name: Compare automatic and explicit profile selection
        id: probes
        run: |
          set -euo pipefail
          probe() {
            local name="$1"
            shift
            set +e
            "$@" >"$RUNNER_TEMP/confinement/$name.txt" 2>&1
            local result="$?"
            set -e
            cat "$RUNNER_TEMP/confinement/$name.txt"
            printf '%s=%s\n' "$name" "$result" | tee -a "$RUNNER_TEMP/confinement/results.txt"
          }
          probe automatic /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
          probe explicit aa-exec -p lekalo-ci-bwrap -- /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
          probe child /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/sh -c 'cat /proc/self/attr/current; grep -E "^(Cap|NoNewPrivs)" /proc/self/status'
      - name: Collect kernel policy diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/confinement"
          sudo journalctl -k --no-pager > "$RUNNER_TEMP/confinement/kernel.txt"
          grep -E 'apparmor=|audit:|bwrap' "$RUNNER_TEMP/confinement/kernel.txt" || true
      - name: Remove the temporary CI profile
        if: always()
        run: sudo apparmor_parser --skip-cache --remove .github/ci/bwrap.apparmor
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-confinement-${{ matrix.os }}
          path: ${{ runner.temp }}/confinement/
          retention-days: 7
      - name: Require the namespace probe to pass
        run: grep -qx 'automatic=0' "$RUNNER_TEMP/confinement/results.txt"
